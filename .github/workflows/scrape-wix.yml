name: Scrape Wix site

# Run manually: Actions tab -> "Scrape Wix site" -> Run workflow
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 trafilatura

      - name: Scrape mesmatters.com
        run: python scripts/scrape_wix.py --site https://www.mesmatters.com

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/legacy public/images/legacy
          git commit -m "Import legacy content from Wix" || echo "Nothing new to commit"
          git push

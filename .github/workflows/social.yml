name: Social posting

on:
  schedule:
    - cron: "*/15 6-20 * * *"   # every 15 minutes, 06:00–20:59 UTC
    - cron: "17 3 * * 1"        # Mondays: refresh the Instagram token
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (print, don't post)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: social
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    if: vars.SOCIAL_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests requests-oauthlib pyyaml cryptography
      - name: Refresh Instagram token
        if: github.event.schedule == '17 3 * * 1'
        run: python scripts/social/publish.py refresh-ig
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          SOCIAL_KEY: ${{ secrets.SOCIAL_KEY }}
      - name: Publish due posts
        if: github.event.schedule != '17 3 * * 1'
        run: python scripts/social/publish.py ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          SOCIAL_KEY: ${{ secrets.SOCIAL_KEY }}
      - name: Save posting record
        run: |
          git config user.name "mesmatters-bot"
          git config user.email "actions@users.noreply.github.com"
          git add social/state
          git diff --cached --quiet || (git commit -m "Social: update posting record [skip ci]" && git pull --rebase && git push)

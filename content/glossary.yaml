# Glossary. One page per term at /glossary/<slug>, plus the index at /glossary/.
# Fields: term, slug (optional), stands (optional), short, body, articles (slugs), see_also (term slugs)

- term: Agentic AI
  short: AI that plans and carries out tasks towards a goal, using other software, rather than only answering questions.
  body: The important word is acts. An agent might re-sequence a schedule or raise a maintenance request, which is powerful and also why it needs limits. On the shopfloor I'd start with agents that prepare information and recommend, with a person making the call.
  articles:
  - agentic-ai-mcp-manufacturing
  - practical-genai-for-the-shopfloor
  see_also:
  - mcp
  - genai
  - ai
- term: AI
  stands: Artificial intelligence
  short: Systems that perform tasks normally needing human intelligence, such as recognising patterns or predicting outcomes.
  body: AI is the broad category, with machine learning and generative AI as two quite different subsets. In a factory, AI is only as good as the shopfloor data it learns from, which is why the data foundation and the AI are best built together.
  articles:
  - ai-ml-genai-on-the-shopfloor
  - ai-needs-shopfloor-data
  see_also:
  - ml
  - genai
  - agentic-ai
- term: APS
  stands: Advanced planning and scheduling
  short: Software for detailed, finite-capacity production scheduling beyond what ERP provides.
  body: APS sequences work in days and hours, respecting changeovers, tooling, labour and material. Not every factory needs one. It's for more advanced scheduling with complex constraints, and for many manufacturers the scheduling in ERP, or an extra ERP module, is enough.
  articles:
  - aps-vs-mes-scheduling
  - mes-functionality-scheduling
  see_also:
  - erp
  - mrp
  - mes
- term: As-built record
  short: The record of exactly what went into a finished item, including lots, serials, operators, measurements and process conditions.
  body: The as-built is MES/MOM's job, because nobody else is there when it happens. It's the foundation of traceability, and for serialised products it's the genealogy you'll need years later when a field failure comes back.
  articles:
  - ebom-mbom-as-built
  - service-data-back-to-engineering
  - manufacturing-traceability
  see_also:
  - ebom
  - mbom
  - genealogy
  - traceability
- term: Autonomous maintenance
  short: Routine asset care such as cleaning and lubrication, carried out by operators rather than the maintenance team.
  body: Operators notice problems first, so giving them day-to-day asset care is a good thing. It works best when their maintenance tasks sit in the same place they run production, not in a separate system with another login.
  articles:
  - mes-functionality-maintenance
  - eam-cmms-and-mes
  see_also:
  - cmms
  - mtbf
  - predictive-maintenance
- term: Backflushing
  short: Recording material consumption automatically after production, calculated from the bill of materials rather than actual usage.
  body: Backflushing is better than nothing, but it records what should have been used rather than what was. MES/MOM posts actual consumption by order and lot, which improves ERP costing and gives you real traceability.
  articles:
  - manufacturing-traceability
  - mes-simplifies-erp
  see_also:
  - bom
  - traceability
  - erp
- term: Batch
  short: A defined quantity of material produced together and treated as one unit for quality and traceability.
  body: Batch manufacturing sits between discrete and process, and is common in food and pharma. In regulated industries the batch record is the heart of compliance.
  articles:
  - discrete-vs-process-manufacturing
  - lims-and-mes
  - mes-in-regulated-industries
  see_also:
  - lot
  - ebr
  - traceability
- term: BOM
  stands: Bill of materials
  short: The list of materials and components, with quantities, needed to make a product.
  body: The BOM changes shape as it moves from design to a finished product, from engineering BOM to manufacturing BOM to order BOM to the as-built record. Most integration arguments come from not agreeing who owns which stage.
  articles:
  - ebom-mbom-as-built
  - erp-master-data-for-mes
  see_also:
  - ebom
  - mbom
  - as-built-record
  - routing
- term: Bottleneck
  short: The machine or operation with the lowest throughput, which limits the output of the whole line.
  body: OEE should be measured on the bottleneck, and an hour lost there is an hour lost for the whole line. When you ask what a 1% OEE improvement is worth, work it out for your bottleneck.
  articles:
  - what-is-oee
  - mes-roi-bottom-line
  see_also:
  - oee
  - cycle-time
- term: CAPA
  stands: Corrective and preventive action
  short: A structured process for fixing quality problems and stopping them recurring.
  body: CAPA is captured in a QMS, or in a MOM platform that covers quality. ERP often handles the full CAPA process once the details have been passed across through an interface. The loop breaks when shopfloor defects never reach it with their context, so the CAPA team ends up asking for details nobody can remember.
  articles:
  - qms-and-mes-quality
  see_also:
  - qms
  - spc
- term: Changeover
  short: Switching a line or machine from one product to the next, including setup and adjustment.
  body: In high-mix, low-volume manufacturing, changeovers are often the biggest constraint on throughput. Measuring them accurately is the first step to reducing them, and tracking tools and setters together turns them into planned activities.
  articles:
  - manufacturing-kpis-beyond-oee
  - mes-functionality-tooling
  see_also:
  - oee
  - bottleneck
- term: CMMS
  stands: Computerised maintenance management system
  short: Software for managing maintenance work orders and spare parts.
  body: A CMMS is the tool the maintenance team uses day to day to look after and manage assets from an operational point of view, where EAM covers the whole asset lifecycle and its financials. A good MOM platform covers the same ground, which replaces the need for a separate CMMS and keeps production and maintenance on the same downtime data. An MES focused on production can feed a CMMS instead.
  articles:
  - cmms-vs-eam-vs-mes
  - eam-cmms-and-mes
  - mes-functionality-maintenance
  see_also:
  - eam
  - mtbf
  - mttr
- term: Composable ERP
  short: An approach where ERP focuses on core business functions and specialist applications handle the rest, connected through open integration.
  body: As ERP vendors pull back to core business functions, the shopfloor is increasingly left to applications built for it, such as MES/MOM. It's one of the forces driving demand in the MES market.
  articles:
  - mes-market-overview
  - what-is-erp
  see_also:
  - erp
  - mes
- term: Connected worker
  short: Digital tools that connect frontline workers to the information, instructions and tasks they need.
  body: Checklists, shift handover, skills, work instructions and safety sign-offs. It solves real frontline problems. It works best as part of the MOM platform rather than a standalone app, so operators have one screen that knows what's running.
  articles:
  - connected-worker-one-app-not-five
  - digital-work-instructions
  - skills-enforcement-shopfloor
  - digital-shift-handover
  see_also:
  - shift-handover
  - mom
  - genai
- term: Contextualised data
  short: Shopfloor data enriched with the order, material, machine, shift, operator and reason behind each event.
  body: A signal that says a machine stopped tells you very little. Context is what turns it into decisions, and into something AI can learn from. On the shopfloor, most of that context comes from MES/MOM.
  articles:
  - contextualised-manufacturing-data
  - manufacturing-data-platforms
  see_also:
  - mes
  - uns
  - historian
- term: Control limits
  short: Limits calculated from a process's own data, usually three standard deviations either side of the average.
  body: Control limits describe what the process normally does. They're different from specification limits, which come from the customer. A process can drift out of control while still in spec, and that's exactly what SPC exists to catch.
  articles:
  - spc-on-the-shopfloor
  see_also:
  - spc
  - cpk
- term: Cpk
  stands: Process capability index
  short: A measure of how well a process stays within its specification limits.
  body: Cpk compares the short-term spread of a process, within subgroups, with the specification, and takes into account how well centred it is. Cp asks the same question as if the process were perfectly centred. Both show the process's potential; Ppk shows its actual performance over time. It's a common question for a knowledge assistant at the line, because few people remember the calculation.
  articles:
  - spc-on-the-shopfloor
  - practical-genai-for-the-shopfloor
  see_also:
  - ppk
  - spc
  - control-limits
- term: Ppk
  stands: Process performance index
  short: A measure of how well a process has actually performed against its specification limits over time.
  body: Ppk compares the overall spread of all the data, including shifts between subgroups such as a new material lot or a different shift, with the specification, and takes into account how well centred the process is. Pp asks the same question as if the process were perfectly centred. Cpk uses only the short-term spread within subgroups, so it shows potential, while Ppk shows what the customer actually received. If Cpk is much higher than Ppk, the process is moving between subgroups. Ppk is often required in initial studies of a new process, such as automotive PPAP.
  articles:
  - spc-on-the-shopfloor
  see_also:
  - cpk
  - process-capability
  - ppap
- term: CPQ
  stands: Configure, price, quote
  short: Software that lets sales or customers configure a product from options and rules, and produces a valid, priced quote.
  body: An accepted configuration is a list of choices, not something the shopfloor can build. ERP usually resolves it into an order-specific BOM and routing before MES/MOM sees it as a normal order.
  articles:
  - cpq-to-shopfloor
  see_also:
  - erp
  - plm
  - bom
- term: Cycle time
  short: The time it takes to produce one unit, compared with the target.
  body: Cycle time variation across shifts and operators is one of the clearest signs of an unstandardised process. The target cycle time also drives the OEE performance figure, so keep it honest.
  articles:
  - takt-time-vs-cycle-time-vs-lead-time
  - manufacturing-kpis-beyond-oee
  - what-is-oee
  see_also:
  - oee
  - changeover
- term: Digital thread
  short: The connected flow of product data from design, through planning and production, to service and back again.
  body: It sounds great on a slide. In practice the thread has knots, especially at the handover between engineering and production. In most manufacturers it runs from PLM through ERP to MES/MOM.
  articles:
  - plm-erp-mes-digital-thread
  - service-data-back-to-engineering
  see_also:
  - plm
  - ebom
  - as-built-record
- term: Digital twin
  short: A virtual model of an asset, process or factory, kept in sync with the real thing through live data.
  body: A twin is only as good as the data feeding it. MES/MOM doesn't do the simulation, but it supplies much of the operational reality that keeps a twin honest.
  articles:
  - mes-and-digital-twins
  see_also:
  - contextualised-data
  - historian
- term: EAM
  stands: Enterprise asset management
  short: Software for managing the full lifecycle of physical assets, usually across many sites.
  body: EAM covers the asset register, maintenance plans, work orders and the financial side of assets. It makes sense for asset-heavy operations with advanced needs, connected to MES/MOM so downtime data is consistent.
  articles:
  - cmms-vs-eam-vs-mes
  - eam-cmms-and-mes
  - mes-functionality-maintenance
  see_also:
  - cmms
  - mtbf
  - mttr
- term: EBOM
  stands: Engineering bill of materials
  short: The product as designed, structured by function, held in PLM.
  body: The EBOM usually leaves out packaging, labels, consumables and the jig you need to hold a part. Restructuring it into the manufacturing BOM is a step that needs one clear owner.
  articles:
  - ebom-mbom-as-built
  - plm-erp-mes-digital-thread
  see_also:
  - mbom
  - plm
  - bom
- term: EBR
  stands: Electronic batch record
  short: A digital record of every step, material, measurement and signature in a batch, enforced by the system as it runs.
  body: In pharma a paper batch record can run to hundreds of pages. An EBR in MES/MOM enforces the sequence and flags deviations as they happen, with weights taken from connected instruments, so QA can review by exception.
  articles:
  - mes-in-regulated-industries
  see_also:
  - batch
  - review-by-exception
- term: Edge
  short: Computing done close to the machines rather than in a central data centre or the cloud.
  body: Machine connectivity usually runs at the edge, close to the equipment, while the main application runs centrally or in the cloud.
  articles:
  - cloud-vs-on-premises-mes
  - ai-ml-genai-on-the-shopfloor
  see_also:
  - iiot
  - ot
- term: ERP
  stands: Enterprise resource planning
  short: The system that runs the business side of a manufacturer on one set of data, from finance and orders to planning and costing.
  body: A good ERP is the backbone of a manufacturing business, and it deserves more credit than it gets. It plans and accounts for production rather than running it minute by minute, which is where specialist applications complement it.
  articles:
  - what-is-erp
  - mes-simplifies-erp
  - smart-factory-tech-stack
  see_also:
  - mes
  - mrp
  - composable-erp
- term: FPY
  stands: First-pass yield
  short: The percentage of output that passes every quality check first time, with no rework.
  body: A line can have a decent OEE quality rate and still be quietly reworking a lot of what it makes. First-pass yield exposes that, so agree the definition before you compare numbers across sites.
  articles:
  - first-pass-yield-vs-rolled-throughput-yield
  - manufacturing-kpis-beyond-oee
  see_also:
  - oee
  - scrap-rate
  - fttq
- term: GenAI
  stands: Generative AI
  short: AI that generates content such as text and code, including large language models.
  body: GenAI's sweet spot is helping people rather than controlling machines. Shift summaries and a knowledge assistant at the line both work today, as long as it has good, contextualised data.
  articles:
  - practical-genai-for-the-shopfloor
  - ai-ml-genai-on-the-shopfloor
  - ai-for-frontline-workers
  see_also:
  - ai
  - ml
  - agentic-ai
- term: Genealogy
  short: The full parent and child history of material, tracing what went into each product and where each input ended up.
  body: Genealogy is the core of traceability, in both directions. The difference between adequate and excellent traceability is everything captured alongside it, from tooling to process parameters.
  articles:
  - manufacturing-traceability
  - ebom-mbom-as-built
  see_also:
  - traceability
  - lot
  - serialisation
- term: Historian
  short: A database designed to store high-frequency time-series data from machines and sensors.
  body: Historians hold the raw, high-frequency data that MES/MOM doesn't need to keep, and engineers use them for troubleshooting and trends. They sit alongside MES/MOM rather than replacing it. Depending on how frequently you need data, you often don't need a historian at all, because MES/MOM can capture and record what's relevant.
  articles:
  - manufacturing-data-platforms
  see_also:
  - contextualised-data
  - iiot
- term: IEC 62443
  short: The main international standard for industrial automation and OT cybersecurity.
  body: Its core idea is grouping assets into zones with similar security needs and controlling the conduits between them. MES/MOM usually sits in the site operations zone, between the enterprise network and the control zones.
  articles:
  - it-vs-ot
  see_also:
  - ot
  - isa-95
- term: IIoT
  stands: Industrial Internet of Things
  short: Connecting machines, sensors and devices so their data can be collected and used.
  body: IIoT is a concept, and it lives in the connectivity layer. It feeds MES/MOM rather than replacing it, because collecting machine data is a small part of running a factory. MES/MOM often acts as the IIoT layer itself, connecting directly to machines, so a separate IIoT platform isn't always needed.
  articles:
  - iiot-vs-mes
  - opc-ua-mqtt-uns-explained
  see_also:
  - opc-ua
  - mqtt
  - uns
- term: Industry 3.0
  slug: industry-3-0
  short: 'The third industrial revolution: electronics and automation on the factory floor, from the late 1960s onwards.'
  body: The PLC, first used by General Motors in 1969, is its symbol. It's also when manufacturing systems first appeared, each running one department, before MES brought them together.
  articles:
  - history-of-mes
  see_also:
  - industry-4-0
  - plc
  - mes
- term: Industry 4.0
  slug: industry-4-0
  short: 'The fourth industrial revolution: connected machines and data brought together across the factory and the supply chain.'
  body: It's a useful label for the shift to connected, data-driven manufacturing, which started gaining traction in the 2010s. I'd still rather describe what something does than give it a version number. A smart factory is defined by outcomes, not by which revolution it belongs to.
  articles:
  - industry-4-0-vs-industry-5-0
  - what-is-a-smart-factory
  - introduction-to-mes-and-smart-manufacturing
  see_also:
  - industry-3-0
  - industry-5-0
  - industry-6-0
  - smart-factory
- term: Industry 5.0
  slug: industry-5-0
  short: A European Commission concept that builds on Industry 4.0 by putting people and sustainability at the centre of manufacturing.
  body: 'The idea is sound: technology should support people on the shopfloor rather than replace them. That''s what connected worker is about. Whether it needed a new number is another question.'
  articles:
  - industry-4-0-vs-industry-5-0
  - what-is-a-smart-factory
  - connected-worker-one-app-not-five
  see_also:
  - industry-4-0
  - industry-6-0
  - connected-worker
- term: Industry 6.0
  slug: industry-6-0
  short: A label with no agreed definition, mostly used in marketing and on LinkedIn to sound a step ahead.
  body: I've seen it used to mean everything from AI-run factories to quantum computing. When a term means whatever the speaker wants it to, it doesn't help anyone make a decision. Ask what the technology actually does on the shopfloor, and what it needs underneath it.
  articles:
  - what-is-a-smart-factory
  see_also:
  - industry-5-0
  - industry-4-0
  - smart-factory
- term: ISA-95
  short: The international standard for integrating enterprise and control systems, also published as IEC 62264.
  body: ISA-95 splits a factory into levels from the physical process up to ERP, with MES/MOM at level 3. Its real value is the discipline it brings to integration, starting with which system owns each piece of data.
  articles:
  - isa-95-explained
  - isa95-integration-patterns
  see_also:
  - mom
  - mes
  - erp
- term: ISO 22400
  short: The international standard defining manufacturing KPIs, including OEE.
  body: You don't need to memorise it, but it's worth knowing it exists, especially if you're comparing figures across sites or systems that might calculate them differently.
  articles:
  - manufacturing-kpis-beyond-oee
  - what-is-oee
  see_also:
  - oee
  - fpy
- term: Kaizen
  short: Continuous improvement, made in small steps by everyone, at the place where the work happens.
  body: Kaizen is a core idea in the Toyota Production System. MES/MOM supports it with standardised processes and accurate data, so improvement rests on facts and you can prove each change worked.
  articles:
  - kaizen-and-mes
  - mes-go-live
  see_also:
  - oee
  - smart-factory
- term: LIMS
  stands: Laboratory information management system
  short: Software for managing lab samples, tests, results and certificates of analysis.
  body: In process industries, LIMS runs the lab while MES/MOM runs the batch. The two meet at the sample, which should be born with its batch context rather than a handwritten label. Depending on what the MOM platform covers, a separate LIMS isn't always needed.
  articles:
  - qms-vs-lims-vs-mes
  - lims-and-mes
  see_also:
  - batch
  - qms
- term: Lot
  short: A quantity of material with a unique identifier, used for tracking and traceability.
  body: Lot numbers often change by day or by production order. Knowing exactly how much of each lot went into each output is what separates full traceability from order-level estimates.
  articles:
  - mes-functionality-inventory
  - manufacturing-traceability
  see_also:
  - batch
  - serialisation
  - genealogy
- term: MBOM
  stands: Manufacturing bill of materials
  short: The product as it will be built, restructured around the process and usually held in ERP.
  body: The MBOM adds what the EBOM leaves out, such as consumables, packaging, labels and phantom kits, and groups sub-assemblies by where they're built. ERP needs it to plan, purchase and cost.
  articles:
  - ebom-mbom-as-built
  - plm-erp-mes-digital-thread
  see_also:
  - ebom
  - bom
  - routing
- term: MCP
  stands: Model Context Protocol
  short: An open standard that lets AI agents connect to other software systems and use their data and functions.
  body: MCP gives agents a common way to talk to applications without a custom integration for every pairing, while the system stays in control of what's exposed. That's useful in a factory, where agents may need to work across dozens of systems.
  articles:
  - agentic-ai-mcp-manufacturing
  see_also:
  - agentic-ai
  - genai
- term: MES
  stands: Manufacturing execution system
  short: The production pillar of manufacturing operations, running orders on the shopfloor and recording output and downtime.
  body: MES is the original term and still the one most people search for. It's one part of MOM rather than another name for it, and the difference matters most when you decide what to buy.
  articles:
  - what-is-mes
  - mes-vs-mom
  - mes-functionality-guide
  see_also:
  - mom
  - erp
  - isa-95
- term: MESA-11
  short: The 1997 model from MESA International setting out eleven core functions of an MES.
  body: The list was already far broader than production execution, covering quality, maintenance, labour, documents and genealogy. That breadth is what we now call MOM. MESA ceased operation in June 2026 and ISA took on its work.
  articles:
  - mesa-and-the-definition-of-mes
  see_also:
  - mes
  - mom
- term: ML
  stands: Machine learning
  short: A type of AI where algorithms are trained on historical data to predict outcomes.
  body: Machine learning has been in factories for longer than most people realise, through SPC-style thinking and predictive maintenance. It needs a clear question and good data, then a model you train and refine before you trust it.
  articles:
  - ai-ml-genai-on-the-shopfloor
  - predictive-maintenance-data
  see_also:
  - ai
  - genai
  - predictive-maintenance
- term: MOM
  stands: Manufacturing operations management
  short: The whole operation, covering production, quality, inventory and maintenance.
  body: The term exists because the scope grew. MOM lines up with the four areas of manufacturing operations defined in ISA-95, and the broadest platforms go further into tooling, energy, skills and connected worker.
  articles:
  - mes-vs-mom
  - what-is-mes
  see_also:
  - mes
  - isa-95
  - connected-worker
- term: MQTT
  short: A lightweight publish-and-subscribe messaging protocol widely used for IIoT.
  body: Devices publish messages to a broker and interested systems subscribe. MQTT doesn't define what the data means on its own; extensions such as Sparkplug add structure. It often works alongside OPC UA.
  articles:
  - opc-ua-mqtt-uns-explained
  see_also:
  - opc-ua
  - uns
  - iiot
- term: MRP
  stands: Material requirements planning
  short: The ERP process that works out what to make and buy, and when, from demand, stock and lead times.
  body: MRP mostly assumes infinite capacity, or uses rough-cut checks. When sequencing needs to respect real constraints, that's the job of APS or the sequencing in MES/MOM.
  articles:
  - erp-vs-mrp-vs-mes
  - what-is-erp
  - aps-vs-mes-scheduling
  see_also:
  - erp
  - aps
- term: MTBF
  stands: Mean time between failures
  short: The average time equipment runs between breakdowns.
  body: MTBF tells you how often equipment fails. It depends on accurate downtime data, which is why production and maintenance need to record the same stops.
  articles:
  - mtbf-vs-mttr-vs-mttf
  - manufacturing-kpis-beyond-oee
  - mes-functionality-maintenance
  see_also:
  - mttr
  - cmms
- term: MTTR
  stands: Mean time to repair
  short: The average time it takes to fix equipment after a breakdown.
  body: Together with MTBF, MTTR shows whether reliability is improving and where maintenance effort is best spent.
  articles:
  - mtbf-vs-mttr-vs-mttf
  - manufacturing-kpis-beyond-oee
  - mes-functionality-maintenance
  see_also:
  - mtbf
  - eam
- term: MTTF
  stands: Mean time to failure
  short: The average time a non-repairable item, such as a bearing or a sensor, lasts before it fails and is replaced.
  body: MTTF is for parts you replace rather than repair. It helps you set replacement intervals and decide how many spares to hold.
  articles:
  - mtbf-vs-mttr-vs-mttf
  see_also:
  - mtbf
  - mttr
- term: OEE
  stands: Overall equipment effectiveness
  short: Availability multiplied by performance multiplied by quality.
  body: OEE compares the good product you made with what the line could have made in the time it was planned to run. Measure it on the bottleneck, from automatic data, and use it to find losses rather than to compare people.
  articles:
  - what-is-oee
  - manufacturing-kpis-beyond-oee
  - mes-roi-bottom-line
  see_also:
  - bottleneck
  - iso-22400
  - fpy
- term: OPC UA
  stands: Open Platform Communications Unified Architecture
  short: The industry standard for secure, structured machine-to-system communication.
  body: OPC UA carries structure and meaning as well as values, and it has security built in. If there's one connectivity standard to know, it's this one.
  articles:
  - opc-ua-mqtt-uns-explained
  see_also:
  - mqtt
  - uns
  - plc
- term: OT
  stands: Operational technology
  short: The hardware and software that monitors and controls physical equipment, as opposed to IT.
  body: In OT the priority is availability and safety rather than confidentiality. You can't patch a PLC on a Tuesday afternoon because a bulletin came out, and security has to respect that.
  articles:
  - it-vs-ot
  see_also:
  - iec-62443
  - plc
  - scada
- term: OTIF
  stands: On time in full
  short: The percentage of orders delivered complete and on the promised date.
  body: OTIF connects shopfloor performance to the customer. You can have great OEE and still miss deliveries if the wrong things were made at the wrong time.
  articles:
  - manufacturing-kpis-beyond-oee
  see_also:
  - oee
- term: PLC
  stands: Programmable logic controller
  short: An industrial computer that controls machines and processes.
  body: PLCs sit at levels 1 and 2 of ISA-95. MES/MOM reads from them, and sometimes sends setpoints down, but ERP should never be wired to them directly.
  articles:
  - plc-vs-scada-vs-dcs-vs-mes
  - history-of-mes
  - smart-factory-technology-mistakes
  see_also:
  - scada
  - opc-ua
  - ot
- term: PLM
  stands: Product lifecycle management
  short: The system holding product designs, specifications, engineering BOMs and engineering changes.
  body: PLM is the source of truth for what a product is, not for how or where you build it. Product data usually reaches the shopfloor through ERP, with a direct link for rich content where it helps.
  articles:
  - plm-erp-mes-digital-thread
  - ebom-mbom-as-built
  see_also:
  - ebom
  - digital-thread
  - erp
- term: Predictive maintenance
  short: Using condition data and failure history to forecast a failure before it happens.
  body: It's the last step after reactive, preventive and condition-based maintenance, and it starts with recording downtime and other sensor data accurately. Models also need operating context, which usually lives in MES/MOM.
  articles:
  - predictive-maintenance-data
  - ai-ml-genai-on-the-shopfloor
  see_also:
  - ml
  - mtbf
  - autonomous-maintenance
- term: QMS
  stands: Quality management system
  short: Software for enterprise quality processes such as CAPA, complaints, audits and document control.
  body: A QMS runs quality over weeks and months across sites and suppliers. A good MOM platform covers that scope as well as quality at the point of production, which replaces the need for a separate QMS. An MES focused on production can feed a QMS instead, so non-conformances arrive with full context.
  articles:
  - qms-vs-lims-vs-mes
  - qms-and-mes-quality
  see_also:
  - capa
  - spc
  - lims
- term: Review by exception
  short: Reviewing only the parts of a batch record that went outside the normal path, instead of every page.
  body: It's possible when an electronic batch record enforces the sequence and flags deviations as they happen.
  articles:
  - mes-in-regulated-industries
  - lims-and-mes
  see_also:
  - ebr
  - batch
- term: Routing
  short: The sequence of operations needed to make a product, with the equipment and cycle times for each.
  body: ERP routings are often set to what costing needed and nothing more. MES/MOM needs to know which machines each operation runs on, with realistic cycle and setup times.
  articles:
  - erp-master-data-for-mes
  - ebom-mbom-as-built
  see_also:
  - bom
  - mbom
  - cycle-time
- term: RTY
  stands: Rolled throughput yield
  short: The probability that a unit passes every step of a process right first time, found by multiplying the first-pass yield of each step.
  body: Four steps at 95% each give an RTY of about 81%, even when final yield looks far better. That gap is the hidden factory of rework and re-inspection.
  articles:
  - first-pass-yield-vs-rolled-throughput-yield
  see_also:
  - fpy
  - yield
- term: SCADA
  stands: Supervisory control and data acquisition
  short: Systems that monitor and control equipment in real time.
  body: If SCADA is mainly used for visibility, MES/MOM can often cover it. In heavier process industries with real control loops, keep both and agree a clear boundary.
  articles:
  - plc-vs-scada-vs-dcs-vs-mes
  - scada-vs-mes
  see_also:
  - plc
  - ot
  - mes
- term: Scrap rate
  short: The percentage of output that's waste.
  body: Scrap throws away the machine time and labour that went into the part as well as the material. In food and process industries, yield is often the biggest single profit lever.
  articles:
  - manufacturing-kpis-beyond-oee
  - mes-roi-bottom-line
  see_also:
  - fpy
  - oee
- term: Serialisation
  short: Giving each individual item a unique identifier so it can be tracked on its own.
  body: Serial items are common in discrete manufacturing and essential for products you'll service later. When something fails in the field, the serial number is the key that links the service record to the as-built record.
  articles:
  - mes-functionality-inventory
  - service-data-back-to-engineering
  see_also:
  - lot
  - genealogy
  - as-built-record
- term: Shift handover
  short: The transfer of status, issues and open actions from one shift to the next.
  body: Most handovers are a quick chat at the door. Build them from MES/MOM data on what actually happened, then let the supervisor add what only a person knows.
  articles:
  - digital-shift-handover
  - practical-genai-for-the-shopfloor
  see_also:
  - connected-worker
  - genai
- term: Smart factory
  short: A manufacturing environment where people, processes and technology work together, supported by data, to maximise efficiency, flexibility and quality.
  body: It comes down to defined processes, planning connected to execution, real-time data at the point of work, one source of truth and people backed to make the call.
  articles:
  - what-is-a-smart-factory
  - time-to-truth
  - smart-factory-tech-stack
  see_also:
  - industry-4-0
  - mom
- term: SPC
  stands: Statistical process control
  short: Using statistics to monitor a process and detect drift before it produces defects.
  body: Inspection tells you a part is bad; SPC tells you it's about to be. It belongs at the line, in front of operators, not in a spreadsheet updated at the end of the week.
  articles:
  - spc-on-the-shopfloor
  - mes-functionality-quality
  see_also:
  - control-limits
  - cpk
  - capa
- term: Traceability
  short: The ability to trace material forwards and backwards through production.
  body: Order-level traceability in ERP is better than nothing. Full traceability adds serials, exact lot quantities, tooling, quality results and process parameters, and it's what turns a recall from a weekend into minutes.
  articles:
  - manufacturing-traceability
  - mes-functionality-inventory
  see_also:
  - genealogy
  - lot
  - serialisation
- term: UNS
  stands: Unified namespace
  short: A real-time view of operational data that connected applications have published to a central broker, organised by the plant hierarchy.
  body: A UNS shows what's happening now. It gives the sender no confirmation that data arrived or was processed, keeps no history on its own and needs strict governance, so it's a poor fit for transactions such as orders and quality status. For those, interfaces that confirm each message are usually the safer option.
  articles:
  - unified-namespace-uns
  - opc-ua-mqtt-uns-explained
  - isa95-integration-patterns
  see_also:
  - mqtt
  - opc-ua
  - contextualised-data
- term: WIP
  stands: Work in progress
  short: Material that has started production but isn't finished.
  body: WIP covers two different things. It can be a semi-finished material with its own material number in ERP, tracked and costed like any other stock. Or it can be material part-way through its routing, with some operations complete, that hasn't yet become a semi-finished or finished material. The second kind is usually only visible in MES/MOM. When you can trust real-time WIP data, you stop holding buffers to cover for not trusting it, which frees working capital.
  articles:
  - wms-vs-mes-inventory
  - mes-roi-bottom-line
  see_also:
  - wms
  - lot
- term: WMS
  stands: Warehouse management system
  short: Software for warehouse operations such as receiving, putaway, picking and storage.
  body: There are several options for warehousing. For the most complex requirements, particularly distribution centres, a WMS is the most advanced option and adds the most value. For simpler warehousing, ERP combined with the inventory and logistics capability of a MOM platform can be enough.
  articles:
  - wms-vs-mes-inventory
  - mes-functionality-logistics
  see_also:
  - wip
  - erp
  - mes
- term: Availability
  short: The OEE factor comparing the time a line actually ran with the time it was planned to run.
  body: In an 8-hour shift with 2 hours of stops, availability is 75%. Downtime is usually the biggest single loss in OEE, which is why accurate, automatic stop detection matters so much.
  articles:
  - what-is-oee
  - oee-vs-teep
  see_also:
  - oee
  - performance
  - quality-rate
  - downtime-reason-codes
- term: Performance
  short: The OEE factor comparing actual output with what the target cycle time says you could have made in the running time.
  body: A figure above 100% means the target cycle time in your master data is wrong. Update it rather than enjoying the inflated number.
  articles:
  - what-is-oee
  see_also:
  - oee
  - availability
  - cycle-time
- term: Quality rate
  short: The OEE factor comparing good output with total output.
  body: Scrap lowers the quality rate. Rework doesn't, but it still costs time, which is why first-pass yield is worth measuring alongside OEE.
  articles:
  - what-is-oee
  - manufacturing-kpis-beyond-oee
  see_also:
  - oee
  - fpy
  - rework
- term: TEEP
  stands: Total effective equipment performance
  short: OEE measured against all calendar time, every hour of every day.
  body: A decent OEE with a low TEEP usually means capacity is hiding in the hours you don't run. Check it before anyone asks for a new line.
  articles:
  - oee-vs-teep
  see_also:
  - oee
  - ooe
- term: OOE
  stands: Overall operations effectiveness
  short: OEE measured against the hours the factory is open, planned stops included.
  body: OOE exposes losses that OEE's baseline hides, such as long breaks, overrunning meetings and generous changeover allowances.
  articles:
  - oee-vs-teep
  see_also:
  - oee
  - teep
- term: Planned production time
  short: The time a line is scheduled to produce, after planned stops such as breaks and planned maintenance are taken out.
  body: It's the baseline OEE availability is measured against. Agree what counts as planned and unplanned before you compare lines or sites.
  articles:
  - oee-vs-teep
  - what-is-oee
  see_also:
  - availability
  - oee
- term: Micro-stop
  short: A short stop, often seconds long, that operators rarely record but that adds up to a large loss.
  body: Most people are genuinely surprised when they first see their micro-stops. They only become visible when stops are detected automatically from the equipment.
  articles:
  - what-is-mes
  - mes-roi-bottom-line
  see_also:
  - availability
  - downtime-reason-codes
- term: Downtime reason codes
  short: The list of reasons an operator or system assigns to each stop, such as jam, material shortage or changeover.
  body: A list that's too long or too vague makes the data useless. Keep it short and grouped by category, and capture the reason while the stop is fresh.
  articles:
  - predictive-maintenance-data
  - mes-functionality-production
  see_also:
  - availability
  - micro-stop
  - mtbf
- term: Takt time
  short: The pace of production needed to meet customer demand, calculated as available time divided by demand.
  body: Takt is set by the customer; cycle time is what the process actually achieves. On a paced line, such as a moving automotive assembly line, the line is set to advance at takt, so each unit spends that fixed time at every station, and line balancing spreads the work so each station's tasks fit within it. If cycle time is longer than takt on the bottleneck, you can't meet demand.
  articles:
  - takt-time-vs-cycle-time-vs-lead-time
  - manufacturing-kpis-beyond-oee
  see_also:
  - cycle-time
  - bottleneck
- term: Throughput
  short: The rate at which a line or plant produces good output, such as units per hour.
  body: Throughput is set by the bottleneck. Improving anything else first rarely increases it.
  articles:
  - what-is-oee
  - aps-vs-mes-scheduling
  see_also:
  - bottleneck
  - oee
- term: Yield
  short: The proportion of input material that ends up as good product.
  body: In food and process industries, yield is often the single biggest profit lever. Natural variation in raw materials means it has to be measured batch by batch.
  articles:
  - first-pass-yield-vs-rolled-throughput-yield
  - manufacturing-kpis-beyond-oee
  - esg-needs-shopfloor-data
  see_also:
  - scrap-rate
  - fpy
  - batch
- term: Rework
  short: Extra work to bring a non-conforming product back to specification.
  body: Rework hides in many quality figures. A line can look fine on quality rate while quietly reworking a lot of what it makes.
  articles:
  - manufacturing-kpis-beyond-oee
  - mes-roi-bottom-line
  see_also:
  - fpy
  - quality-rate
  - non-conformance
- term: Non-conformance
  short: A product or process that doesn't meet its specification.
  body: Record it at the source with full context, including the order, lot, machine and a photo. Rules then decide whether it stays a local scrap or escalates to a non-conformance and CAPA process, usually in ERP.
  articles:
  - qms-and-mes-quality
  - mes-functionality-quality
  see_also:
  - capa
  - quality-hold
  - qms
- term: Quality hold
  short: A block that stops a lot or batch being used or shipped until it's released.
  body: Holds work best when they're automatic and visible everywhere the material might move, with MES/MOM enforcing them at the line.
  articles:
  - mes-functionality-quality
  - lims-and-mes
  see_also:
  - non-conformance
  - batch-release
- term: Batch release
  short: The formal decision that a batch meets its specification and can be used or shipped.
  body: In regulated industries it's often a QA decision based on lab results and the batch record. It can be recorded in ERP, LIMS, a QMS or MES/MOM, as long as everyone knows which.
  articles:
  - lims-and-mes
  - mes-in-regulated-industries
  see_also:
  - quality-hold
  - ebr
  - review-by-exception
- term: Inspection plan
  short: The defined set of checks for a product, with when to perform them and the limits to check against.
  body: In MES/MOM, inspections are triggered by what's actually running, so the operator doesn't have to remember which checks apply.
  articles:
  - mes-functionality-quality
  see_also:
  - specification-limits
  - spc
- term: Specification limits
  short: The acceptable range for a measurement, set by the customer or engineering.
  body: Inside the limits is good; outside is scrap or rework. They're different from control limits, which are calculated from the process's own data to show its natural variation, so you can spot a change in the process while every part is still in spec.
  articles:
  - spc-on-the-shopfloor
  - mes-functionality-quality
  see_also:
  - control-limits
  - cpk
- term: Control chart
  short: A chart plotting measurements over time against the process average and control limits.
  body: Operators are alerted when a measurement falls outside the control limits, or when a pattern appears, such as a run of points on one side of the average. Start with a few rules, or the alarms get ignored, then add more over time.
  articles:
  - spc-on-the-shopfloor
  see_also:
  - spc
  - control-limits
- term: Metrology
  short: The science of measurement, and on the shopfloor the gauges and instruments used for quality checks.
  body: Connecting metrology equipment to MES/MOM removes typing errors and captures measurements against the right order and sample automatically.
  articles:
  - mes-functionality-quality
  see_also:
  - inspection-plan
  - spc
- term: First article inspection
  short: A full inspection of the first part from a new production run to prove the process can make it to specification.
  body: Common in aerospace, often against AS9102. MES/MOM can stop the rest of the order until the first article passes.
  articles:
  - mes-in-regulated-industries
  see_also:
  - ppap
  - as9100
- term: PPAP
  stands: Production part approval process
  short: The automotive process for proving a supplier's production process can consistently make a part to specification before supply starts.
  body: PPAP comes with control plans that define every check. MES/MOM is where those checks are enforced day to day.
  articles:
  - mes-in-regulated-industries
  see_also:
  - iatf-16949
  - first-article-inspection
- term: IATF 16949
  short: The international quality management standard for the automotive industry.
  body: It builds on ISO 9001 with automotive requirements such as traceability and control plans, and customers audit against it.
  articles:
  - mes-in-regulated-industries
  see_also:
  - ppap
  - qms
- term: AS9100
  short: The quality management standard for the aerospace and defence industry.
  body: Aerospace customers expect serialised traceability and first article inspection, and AS9100 is the framework behind those expectations.
  articles:
  - mes-in-regulated-industries
  see_also:
  - first-article-inspection
  - serialisation
- term: ISO 13485
  short: The international quality management standard for medical devices.
  body: Since 2 February 2026, the FDA's Quality Management System Regulation incorporates it by reference, so US device makers now follow the same standard as most of the world.
  articles:
  - mes-in-regulated-industries
  see_also:
  - dhr
- term: 21 CFR Part 11
  short: The US FDA regulation for electronic records and electronic signatures.
  body: Records must be secure, attributable, audit-trailed and validated. In Europe, EU GMP Annex 11 covers similar ground.
  articles:
  - mes-in-regulated-industries
  see_also:
  - eu-gmp-annex-11
  - ebr
- term: EU GMP Annex 11
  short: The European guidance for computerised systems used in GMP-regulated manufacturing.
  body: It's the European counterpart to 21 CFR Part 11, and it shapes how pharmaceutical MES/MOM is validated and run.
  articles:
  - mes-in-regulated-industries
  see_also:
  - 21-cfr-part-11
  - gmp
- term: GMP
  stands: Good manufacturing practice
  short: Regulations and guidelines that make sure products such as medicines and food are consistently made to quality standards.
  body: GMP shapes how processes are documented and how systems such as MES/MOM are validated.
  articles:
  - mes-in-regulated-industries
  see_also:
  - eu-gmp-annex-11
  - validation
- term: Validation
  short: Documented evidence that a computerised system does what it's meant to, consistently, in a regulated environment.
  body: Validation is a big overhead in pharma and devices, and every customisation adds to it. That's one more reason to configure rather than customise.
  articles:
  - mes-in-regulated-industries
  - configure-dont-customise
  see_also:
  - gmp
  - customisation
- term: DHR
  stands: Device history record
  short: The record of how each medical device or batch of devices was built.
  body: It covers materials, operations, operators, inspections and labelling. An electronic DHR in MES/MOM is built as the device is made, not assembled afterwards.
  articles:
  - mes-in-regulated-industries
  see_also:
  - iso-13485
  - as-built-record
- term: Recall
  short: Withdrawing products from customers or the market because of a safety or quality problem.
  body: Traceability decides how big a recall has to be. Exact genealogy lets you identify the affected units rather than quarantining a week of production.
  articles:
  - manufacturing-traceability
  - lot-vs-serial-traceability
  see_also:
  - traceability
  - genealogy
- term: Time-based traceability
  short: Linking inputs to outputs by time, matching the materials consumed in a time window with the materials produced in the same window.
  body: MES/MOM records when each input lot was being fed into the line and when each output was produced. To trace an output, you look up which inputs were being consumed while it was made. The window is usually shifted by the time material takes to travel through the line, so the output is matched with what went in at the start rather than at the same moment. It's the practical answer where material doesn't arrive in neat lots, as in extrusion and many continuous food lines.
  articles:
  - lot-vs-serial-traceability
  - manufacturing-traceability
  see_also:
  - traceability
  - lot
- term: Kanban
  short: A pull signal, physical or digital, that triggers replenishment when material is used.
  body: Digital kanban in MES/MOM raises replenishment from real consumption rather than from a plan made days earlier.
  articles:
  - wms-vs-mes-inventory
  - mes-functionality-logistics
  see_also:
  - line-side-replenishment
  - supermarket
- term: Supermarket
  short: A small, controlled store close to the line, holding the material production needs next.
  body: Supermarkets sit between the warehouse and the line, and are restocked by replenishment signals.
  articles:
  - mes-functionality-inventory
  - mes-functionality-logistics
  see_also:
  - kanban
  - line-side-replenishment
- term: Line-side replenishment
  short: Moving material from the warehouse or a supermarket to the line as it's needed.
  body: Ideally MES/MOM raises the request, because it knows what's running, what's next and what's left at the line.
  articles:
  - wms-vs-mes-inventory
  - mes-functionality-logistics
  see_also:
  - kanban
  - wms
  - supermarket
- term: Kitting
  short: Picking all the components for an order or operation together and delivering them as a set.
  body: Kitting suits assembly. Pushed too far in advance, kits tie up stock and go out of date when the schedule changes.
  articles:
  - wms-vs-mes-inventory
  see_also:
  - line-side-replenishment
  - bom
- term: Production order
  short: An instruction to make a quantity of a product, with its BOM, routing and due date.
  body: ERP creates and costs it; MES/MOM executes it. In a good MES, everything that happens on the shopfloor is tied back to the order.
  articles:
  - mes-functionality-production
  - mes-vs-erp
  see_also:
  - order-bom
  - routing
- term: Order BOM
  short: The copy of the manufacturing BOM taken for one production order, at the revision and quantity for that order.
  body: This is what goes to MES/MOM, not the master BOM. It can change after release when a planner substitutes a component.
  articles:
  - ebom-mbom-as-built
  see_also:
  - mbom
  - bom
  - production-order
- term: Phantom BOM
  short: A bill of materials for a set of parts that are picked or built together but never stocked as an item.
  body: Phantom kits are one of the ways the manufacturing BOM differs from the engineering BOM.
  articles:
  - ebom-mbom-as-built
  see_also:
  - mbom
  - kitting
- term: Configurable BOM
  short: A "super BOM" containing every option for a product, with rules that select the right components for each configuration.
  body: ERP usually resolves it into an order-specific BOM once a configuration is accepted in CPQ.
  articles:
  - cpq-to-shopfloor
  see_also:
  - cpq
  - order-bom
  - configure-to-order
- term: Configure-to-order
  short: Making products from predefined options chosen by the customer.
  body: Every option already exists, so the configuration can be turned into a BOM and routing by rules.
  articles:
  - cpq-to-shopfloor
  see_also:
  - engineer-to-order
  - cpq
- term: Engineer-to-order
  short: Making products that need some design work for each order.
  body: Production often starts before engineering is finished, so MES/MOM has to handle orders whose later operations aren't defined yet.
  articles:
  - cpq-to-shopfloor
  see_also:
  - configure-to-order
  - plm
- term: Recipe
  short: The formulation and process steps for a batch in process manufacturing, with parameters for each step.
  body: Recipes include substitutions when an ingredient isn't available. In MES/MOM the recipe enforces the sequence so steps can't be skipped.
  articles:
  - discrete-vs-process-manufacturing
  - mes-in-regulated-industries
  see_also:
  - batch
  - ebr
  - process-manufacturing
- term: Discrete manufacturing
  short: Making individual, countable items that could in theory be taken apart.
  body: You count pieces and often track serial numbers. In high-mix environments, changeovers are the biggest constraint.
  articles:
  - discrete-vs-process-manufacturing
  see_also:
  - process-manufacturing
  - serialisation
- term: Process manufacturing
  short: Transforming materials by mixing, blending, heating or reacting, so the result can't be turned back into its ingredients.
  body: You measure in litres and kilograms and work from recipes. Yields vary with natural raw materials.
  articles:
  - discrete-vs-process-manufacturing
  - lims-and-mes
  see_also:
  - discrete-manufacturing
  - recipe
  - batch
- term: Mixed-mode manufacturing
  short: A process that combines process and discrete steps, such as mixing a batch then filling and packing it into cases.
  body: It's far more common than software brochures suggest, so check a system handles both before you buy.
  articles:
  - discrete-vs-process-manufacturing
  see_also:
  - discrete-manufacturing
  - process-manufacturing
- term: Finite capacity scheduling
  short: Scheduling that respects the real limits of machines, labour, tools and material.
  body: ERP's MRP mostly assumes infinite capacity. Where sequencing is complex, finite scheduling is the job of an APS; otherwise ERP, or an ERP module, is often enough. MES/MOM feeds back what actually happened.
  articles:
  - aps-vs-mes-scheduling
  see_also:
  - aps
  - mrp
- term: Digital work instructions
  short: Step-by-step instructions presented automatically for the job that's running, always the latest version.
  body: A PDF on a tablet is paper on a screen. Done properly, instructions capture confirmations and react to what's happening on the line.
  articles:
  - digital-work-instructions
  - connected-worker-one-app-not-five
  see_also:
  - connected-worker
  - error-proofing
- term: Error-proofing
  short: Designing a process or system so mistakes are prevented or caught immediately.
  body: Examples include scanning to confirm the right material before it's consumed, or blocking an order start until checks pass.
  articles:
  - mes-functionality-inventory
  - skills-enforcement-shopfloor
  see_also:
  - digital-work-instructions
  - skills-matrix
- term: Andon
  short: A signal, often a light or screen, that shows a problem on the line and calls for help.
  body: A digital andon linked to MES/MOM records why help was called and how long the response took, so the data can be used to improve.
  articles:
  - mes-functionality-production
  see_also:
  - downtime-reason-codes
  - connected-worker
- term: Skills matrix
  short: A record of who is trained and qualified for which operations and equipment.
  body: Most live in a spreadsheet nobody checks at the point of work. The real value comes when skills are checked as each task starts, so only someone qualified for that operation or machine can do it.
  articles:
  - skills-enforcement-shopfloor
  see_also:
  - connected-worker
  - error-proofing
- term: Tool life
  short: How much use a tool such as a mould or die has left, counted in shots, strokes, cycles or hours.
  body: Counted automatically from production, it triggers maintenance by usage and helps explain quality problems.
  articles:
  - mes-functionality-tooling
  see_also:
  - cavity
  - preventive-maintenance
- term: Cavity
  short: One of the moulding positions in a multi-cavity tool, each producing a part per cycle.
  body: Tracking which cavity made each part often reveals the root cause of a quality problem in minutes.
  articles:
  - mes-functionality-tooling
  - mes-functionality-quality
  see_also:
  - tool-life
  - traceability
- term: Reactive maintenance
  short: Fixing equipment only when it breaks.
  body: Viable for cheap, non-critical assets where downtime doesn't significantly affect production. Expensive everywhere else, and usually not the best option.
  articles:
  - preventive-vs-predictive-maintenance
  see_also:
  - preventive-maintenance
  - predictive-maintenance
- term: Preventive maintenance
  short: Maintaining equipment on a schedule, by calendar time or by usage.
  body: 'Better than reactive but blunt: sometimes too early, sometimes too late. Usage counters from MES/MOM make it more accurate.'
  articles:
  - preventive-vs-predictive-maintenance
  - mes-functionality-maintenance
  see_also:
  - condition-based-maintenance
  - predictive-maintenance
- term: Condition-based maintenance
  short: Maintaining equipment when a measured condition, such as vibration or temperature, crosses a limit.
  body: It's the practical step before predictive, and works well on critical assets with a measurable sign of wear.
  articles:
  - preventive-vs-predictive-maintenance
  - predictive-maintenance-data
  see_also:
  - preventive-maintenance
  - predictive-maintenance
- term: Asset hierarchy
  short: The structure of sites, areas, lines, machines and components that maintenance and production data roll up through.
  body: Agree it early and use it everywhere. Process maps and reports all hang off it.
  articles:
  - mes-functionality-maintenance
  - manufacturing-process-mapping
  see_also:
  - isa-95
  - eam
- term: DCS
  stands: Distributed control system
  short: A control system for continuous and batch processes, with control spread across the plant.
  body: Common in chemicals and other large process plants. It spans ISA-95 levels 1 and 2, below MES/MOM.
  articles:
  - plc-vs-scada-vs-dcs-vs-mes
  - isa-88-and-isa-95
  - isa-95-explained
  - scada-vs-mes
  see_also:
  - scada
  - plc
- term: ISA-88
  stands: Batch control standard, also known as S88
  short: The international standard for batch control, defining how recipes and equipment are modelled.
  body: Its big idea is separating the recipe from the equipment, so the same recipe can run on different units. It lives mainly in the control system and fits alongside ISA-95, which covers the layer above.
  articles:
  - isa-88-and-isa-95
  - plc-vs-scada-vs-dcs-vs-mes
  see_also:
  - isa-95
  - dcs
  - recipe
- term: HMI
  stands: Human-machine interface
  short: The screen or panel an operator uses to monitor and control a machine.
  body: The HMI controls the machine, and MES/MOM manages the operation around it. Ideally MES/MOM drives the operator's screen too, so operators don't have to work across both.
  articles:
  - scada-vs-mes
  see_also:
  - scada
  - plc
- term: Sparkplug B
  short: A specification on top of MQTT that defines the payload format and tracks whether each device is online.
  body: Plain MQTT doesn't say what a message means. Sparkplug B gives different systems a shared way to understand the same messages.
  articles:
  - opc-ua-vs-mqtt
  - opc-ua-mqtt-uns-explained
  see_also:
  - mqtt
  - uns
- term: Purdue model
  short: A reference model that layers industrial networks from the physical process up to enterprise systems.
  body: 'It splits a plant into levels: the physical process at level 0, sensors and controllers at levels 1 and 2, site operations such as MES/MOM at level 3, and business systems such as ERP at levels 4 and 5. It''s mostly used in OT security, to decide which systems can talk to which, and the levels line up closely with ISA-95.'
  articles:
  - it-vs-ot
  see_also:
  - isa-95
  - iec-62443
- term: IT/OT convergence
  slug: it-ot-convergence
  short: Bringing information technology and operational technology together under a shared architecture and governance.
  body: It doesn't mean one side taking over the other. It means agreed architecture and people who understand both sets of constraints.
  articles:
  - it-vs-ot
  see_also:
  - ot
  - mom
- term: Data lake
  short: A large store of raw, often unstructured data from many sources.
  body: Often the raw material for analytics and machine learning. Without structure and context, a lake becomes a swamp.
  articles:
  - manufacturing-data-platforms
  see_also:
  - data-warehouse
  - historian
  - contextualised-data
- term: Data warehouse
  short: A structured database organised for reporting and business intelligence.
  body: Best for aggregated data that answers known questions, such as output and scrap by site by month.
  articles:
  - manufacturing-data-platforms
  see_also:
  - data-lake
- term: Data fabric
  short: An architecture that makes data discoverable and usable across many systems without copying it all into one place.
  body: Useful in large organisations with many systems and sites. The context that makes shopfloor data valuable still has to be created upstream.
  articles:
  - manufacturing-data-platforms
  see_also:
  - data-lake
  - uns
- term: Time-series data
  short: Values recorded against time at a regular interval, such as an oven temperature read at a consistent frequency.
  body: The interval depends on how quickly the value changes and what it's used for, from fractions of a second to every few minutes. Historians are built for it at very high frequency. MES/MOM records events with context and can capture the process values most operations need. Where both are used, they link by time and equipment.
  articles:
  - historian-vs-mes
  - manufacturing-data-platforms
  see_also:
  - historian
  - contextualised-data
- term: Configuration
  short: Switching settings on and off to make software work your way, without writing code.
  body: Configuration survives upgrades. It still needs proper training and thought to set master data and settings up correctly.
  articles:
  - configure-dont-customise
  see_also:
  - customisation
  - low-code
- term: Customisation
  short: Changing a product's code to support specific business logic.
  body: The most expensive way to make software fit. Every customisation has to be retested at each upgrade, and in regulated industries revalidated too.
  articles:
  - configure-dont-customise
  - build-vs-buy-mes
  see_also:
  - configuration
  - low-code
  - validation
- term: Low-code
  short: Tools that let people build screens and logic by dragging and configuring rather than writing code.
  body: Low-code covers more complex needs without touching the product's code, so it stays upgradeable.
  articles:
  - build-vs-buy-mes
  - configure-dont-customise
  see_also:
  - configuration
  - customisation
- term: Homegrown MES
  short: A manufacturing execution system built in-house rather than bought.
  body: They can be quick to start, but they're difficult to implement well, particularly for user experience, performance, scalability and security. Over time they tend to depend on a few people, and every upgrade and new capability is yours to build. Eventually they need replacing, which is mostly a people challenge.
  articles:
  - build-vs-buy-mes
  - replacing-a-homegrown-mes
  see_also:
  - customisation
  - point-solution
- term: Point solution
  short: A tool that solves one narrow problem, such as an OEE dashboard or a checklist app.
  body: It fixes today's gap quickly, often with real depth. As requirements grow, each extra tool adds an interface to own, and context can get lost between them.
  articles:
  - smart-factory-technology-mistakes
  - paperless-manufacturing
  see_also:
  - mom
  - homegrown-mes
- term: Enterprise template
  short: A standard configuration of processes, master data, KPIs and screens rolled out to every site.
  body: Later sites go live much faster. Some local variation is needed for flexibility and should be managed within the template, but variation that's really just habit should be removed or kept to a minimum.
  articles:
  - mes-multi-site-rollout
  see_also:
  - centre-of-excellence
- term: Centre of excellence
  short: A central team that owns the enterprise standard and drives adoption across sites.
  body: It blends IT and OT. IT owns the application and integrations; OT owns processes, master data standards and KPIs.
  articles:
  - mes-multi-site-rollout
  - mes-implementation-team
  see_also:
  - enterprise-template
  - it-ot-convergence
- term: Hypercare
  short: The period of extra support straight after go-live.
  body: Problems always surface in the first weeks. Fix them fast enough that people keep trusting the system.
  articles:
  - mes-go-live
  see_also:
  - super-user
- term: Super user
  short: A member of the operations team trained in depth on a new system, who supports colleagues on the floor.
  body: Free up their time to help, especially during hypercare. Developers of a replaced homegrown system often make excellent super users.
  articles:
  - mes-go-live
  - replacing-a-homegrown-mes
  see_also:
  - hypercare
  - change-management
- term: Change management
  short: The structured work of helping people adopt a new way of working.
  body: Every project meets resistance, because change is uncomfortable. Involve people in the design and explain why it makes their shift easier.
  articles:
  - manufacturing-change-management
  see_also:
  - super-user
  - process-mapping
- term: Process mapping
  short: Documenting how work actually happens, step by step, before designing how it should happen.
  body: I like a swimlane grid with departments across the top and processes down the side. Digitise a broken process and you get a faster broken process.
  articles:
  - manufacturing-process-mapping
  see_also:
  - asset-hierarchy
  - change-management
- term: Paperless manufacturing
  short: Replacing paper travellers and check sheets with digital data capture on the shopfloor.
  body: A great first step. Choose a platform that can grow into full MES/MOM so you don't swap paper silos for digital ones.
  articles:
  - paperless-manufacturing
  see_also:
  - traveller
  - point-solution
- term: Traveller
  short: A paper document that moves with an order through production, collecting signatures and notes.
  body: Finding out where an order is means walking the floor to find its traveller. It's often one of the first pieces of paper worth removing.
  articles:
  - paperless-manufacturing
  see_also:
  - paperless-manufacturing
  - production-order
- term: Copilot
  short: An AI assistant built into the software people already use, answering questions in plain English.
  body: 'On the shopfloor, a copilot is only as good as its context: the order, material, recent stops and approved procedures.'
  articles:
  - agentic-ai-mcp-manufacturing
  - ai-for-frontline-workers
  - practical-genai-for-the-shopfloor
  see_also:
  - genai
  - connected-worker
- term: Vision inspection
  short: Cameras and trained models that spot defects automatically, often running at the edge.
  body: On high-volume lines, such as can ends, the system photographs every item and rejects defects automatically, because no operator could review them at that speed. Where a defect is harder to judge, or volumes are lower, it can flag likely defects for a person to confirm instead.
  articles:
  - ai-ml-genai-on-the-shopfloor
  - ai-for-frontline-workers
  see_also:
  - ml
  - edge
- term: ESG
  stands: Environmental, social and governance
  short: The framework companies use to report on sustainability and responsible business.
  body: 'Much of the evidence starts on the shopfloor: energy per product, scrap, water use and yield. Treated as operational efficiency, it pays for itself.'
  articles:
  - esg-needs-shopfloor-data
  - mes-functionality-energy
  see_also:
  - yield
  - scrap-rate
- term: Lean
  short: A way of running operations focused on customer value and removing waste, drawn from the Toyota Production System.
  body: Lean and MES/MOM fit together well. Standardised processes and accurate data make improvement measurable.
  articles:
  - kaizen-and-mes
  see_also:
  - kaizen
  - gemba
  - pdca
- term: Gemba
  short: The place where the work actually happens, the shopfloor.
  body: 'It''s best known through gemba walks: leaders regularly walking the shopfloor to see problems, or potential problems, first hand and talk to the people doing the work. Real-time data helps you decide where to look, but it doesn''t replace the walk.'
  articles:
  - kaizen-and-mes
  see_also:
  - kaizen
  - lean
- term: PDCA
  stands: Plan, do, check, act
  short: The improvement cycle of planning a change, trying it, checking the result and standardising it or trying again.
  body: After go-live, continuous improvement becomes the rhythm. The difference is that each cycle is now based on data rather than gut feel.
  articles:
  - kaizen-and-mes
  - mes-go-live
  see_also:
  - kaizen
  - lean
- term: SaaS
  stands: Software as a service
  short: Software delivered from the cloud on a subscription, with the vendor running the infrastructure and updates.
  body: Most MES/MOM is already hosted centrally so it can serve several factories, whichever way it's deployed. SaaS moves that hosting to the vendor, who usually manages it for uptime more effectively than servers run by each manufacturer.
  articles:
  - cloud-vs-on-premises-mes
  see_also:
  - edge
  - hybrid-deployment
- term: Hybrid deployment
  short: Running critical shopfloor functions locally at the edge and the rest of the application in the cloud.
  body: Some manufacturers choose it to keep machine-level functions close to the line while the main application runs in the cloud.
  articles:
  - cloud-vs-on-premises-mes
  see_also:
  - saas
  - edge
- term: Shopfloor
  short: The production area of a factory, where products are made and the operation actually runs.
  body: It's where the data that matters is created, and where most smart factory programmes succeed or fail.
  articles:
  - shopfloor-applications-explained
  - what-is-a-smart-factory
  see_also:
  - mom
  - gemba
- term: WFM
  stands: Workforce management
  short: 'Software for planning and managing people: shift patterns, rosters, time and attendance, absence and labour costs.'
  body: It's typically used by HR and operations to make sure the right number of people, with the right skills, are scheduled for each shift, while keeping to working time rules and controlling labour cost.
  articles:
  - skills-enforcement-shopfloor
  - connected-worker-one-app-not-five
  see_also:
  - time-and-attendance
  - labour-tracking
  - skills-matrix
- term: Time and attendance
  short: Recording when people clock on and off, for pay, compliance and labour planning.
  body: Basic time and attendance, such as who clocked in and out and who was working on each line, can be managed in MES/MOM where it's available. Rules for pay, overtime, breaks and working time differ from country to country, and once those rules get complex, a WFM, HR or ERP system makes more sense. Either way, linking it to MES/MOM shows who was actually available on each line, which helps explain output and cost.
  articles:
  - who-benefits-from-mes
  see_also:
  - wfm
  - labour-tracking
- term: Labour tracking
  short: Recording which people worked on which orders and operations, and for how long.
  body: It turns labour from a site-wide cost into a cost per order and per product. MES/MOM captures it as people log on to operations, rather than from timesheets afterwards.
  articles:
  - mes-roi-bottom-line
  - who-benefits-from-mes
  see_also:
  - wfm
  - time-and-attendance
- term: Supply chain
  short: Everything involved in getting a product from raw materials to the customer, including suppliers, production, warehousing and transport.
  body: The factory is one link in it. Accurate shopfloor data makes the rest of the chain more reliable, because promises to customers rest on what production can actually deliver.
  articles:
  - what-is-erp
  - wms-vs-mes-inventory
  see_also:
  - scm
  - otif
- term: SCM
  stands: Supply chain management
  short: Planning and coordinating the flow of materials and information across suppliers, plants, warehouses and customers.
  body: SCM software usually sits alongside ERP at the business level. It depends on accurate stock and production data from the plants, which is where MES/MOM and WMS come in.
  articles:
  - what-is-erp
  - smart-factory-tech-stack
  see_also:
  - supply-chain
  - erp
- term: Demand planning
  short: Forecasting what customers will order, so production and purchasing can be planned ahead.
  body: The forecast feeds planning and MRP in ERP. Production then turns the plan into orders, and MES/MOM records what was actually made.
  articles:
  - what-is-erp
  - aps-vs-mes-scheduling
  see_also:
  - mrp
- term: Procurement
  short: Buying the materials, components and services a manufacturer needs, from choosing suppliers to paying them.
  body: Procurement lives in ERP. Accurate consumption data from the shopfloor, covering production materials and the spare parts maintenance uses, means purchasing works from real usage instead of estimates.
  articles:
  - what-is-erp
  see_also:
  - erp
  - supplier-quality
- term: Supplier quality
  short: Making sure purchased materials and components meet specification, through supplier approvals and incoming inspection.
  body: Supplier quality sits in a QMS, or in a MOM platform that covers the quality system. Lot-level traceability on the shopfloor is what lets you trace a problem back to a specific supplier lot.
  articles:
  - qms-and-mes-quality
  - lot-vs-serial-traceability
  see_also:
  - qms
  - lot
  - capa
- term: Lead time
  short: The time between starting a process and finishing it, such as from order to delivery or from material arrival to use.
  body: Planning relies on lead times being right. In continuous processes, the actual lead time through the line is also how time-based traceability works out which input went into which output.
  articles:
  - takt-time-vs-cycle-time-vs-lead-time
  - what-is-erp
  - lot-vs-serial-traceability
  see_also:
  - mrp
  - time-based-traceability
- term: Safety stock
  short: Extra inventory held to protect against variation in demand or supply.
  body: Some safety stock is sensible. A lot of it is there because nobody trusts the inventory data, and real-time tracking lets you reduce it.
  articles:
  - mes-roi-bottom-line
  - wms-vs-mes-inventory
  see_also:
  - wip
  - inventory-turns
- term: Inventory turns
  short: How many times inventory is used and replaced over a period, usually a year.
  body: Higher turns mean less working capital tied up in stock. Trustworthy, real-time inventory data is one of the simplest ways to improve them.
  articles:
  - mes-roi-bottom-line
  see_also:
  - safety-stock
  - wip
- term: TMS
  stands: Transport management system
  short: Software for planning, executing and tracking the movement of goods, such as carrier selection and delivery scheduling.
  body: TMS sits at the end of the chain, after the warehouse. It's a business-level system, usually connected through ERP rather than to the shopfloor.
  articles:
  - smart-factory-tech-stack
  see_also:
  - wms
  - supply-chain
- term: CRM
  stands: Customer relationship management
  short: Software for managing customers and sales opportunities.
  body: CRM rarely touches the shopfloor directly. Its usual connection to manufacturing is through ERP, which turns customer orders into demand for production. Customer complaints, though, need to trace back through quality and production records, which is where the systems meet.
  articles:
  - service-data-back-to-engineering
  see_also:
  - cpq
  - fsm
- term: FSM
  stands: Field service management
  short: Software for managing service visits, technicians, parts used and faults found at customer sites.
  body: When products fail in the field, FSM records the failure against the serial number, and the as-built record in MES/MOM shows what the failed units had in common.
  articles:
  - service-data-back-to-engineering
  see_also:
  - serialisation
  - as-built-record
  - crm
- term: EHS
  stands: Environment, health and safety
  short: The processes and systems that manage workplace safety and environmental compliance.
  body: Safety checks and sign-offs at the point of work are a natural part of connected worker, built into the screens operators already use.
  articles:
  - connected-worker-one-app-not-five
  - esg-needs-shopfloor-data
  see_also:
  - connected-worker
  - esg
- term: Master data
  short: The core reference data systems share, such as materials, BOMs, routings, equipment and customers.
  body: MES/MOM needs more detailed master data than most ERP set-ups were built with. Getting the master data right in ERP is critical, and where needed, extra detail can then be added in the specialised applications.
  articles:
  - erp-master-data-for-mes
  - isa95-integration-patterns
  see_also:
  - mdm
  - routing
  - bom
- term: MDM
  stands: Master data management
  short: The processes and tools that keep master data accurate and consistent across systems.
  body: The rule that matters most is one owner per object. Everyone else holds a copy.
  articles:
  - erp-master-data-for-mes
  - isa95-integration-patterns
  see_also:
  - master-data
- term: API
  stands: Application programming interface
  short: A defined way for one piece of software to request data or actions from another.
  body: APIs are how most modern integrations work. Agree which system owns the data before anyone starts writing code against one.
  articles:
  - isa95-integration-patterns
  see_also:
  - middleware
  - event-driven-architecture
- term: Middleware
  short: Software that sits between systems to move and translate data, so each system connects once rather than to every other.
  body: Each system connects once to the integration layer, which handles mapping, routing, retries and monitoring in one place. It adds another layer to run and maintain.
  articles:
  - isa95-integration-patterns
  see_also:
  - point-to-point-integration
  - ipaas
  - api
- term: iPaaS
  stands: Integration platform as a service
  short: A cloud-based integration platform for connecting applications, with monitoring and retries in one place.
  body: 'It''s the cloud-hosted equivalent of middleware: a vendor-run platform with prebuilt connectors, data mapping and monitoring for moving information between applications.'
  articles:
  - isa95-integration-patterns
  - cloud-vs-on-premises-mes
  see_also:
  - middleware
  - api
- term: Point-to-point integration
  short: Connecting systems directly to each other, one link per pair.
  body: Direct links are often the safest option, because the sending system gets a response from the receiving system and knows whether each message arrived and was accepted. As the number of systems grows, each link needs to be maintained when either side changes.
  articles:
  - isa95-integration-patterns
  see_also:
  - middleware
  - uns
- term: Event-driven architecture
  short: An integration approach where systems publish events, such as "order started" or "lot on hold", and others react to them.
  body: It suits the shopfloor, where things happen at unpredictable times. Systems react as soon as something changes, rather than checking for updates on a timer.
  articles:
  - isa95-integration-patterns
  - opc-ua-mqtt-uns-explained
  see_also:
  - mqtt
  - api
- term: Work centre
  short: A machine, line or group of resources where an operation is performed, used for planning and costing.
  body: ERP routings often define work centres broadly. MES/MOM usually needs to know the specific machines within them.
  articles:
  - erp-master-data-for-mes
  see_also:
  - routing
  - asset-hierarchy
- term: Capacity planning
  short: Working out whether you have enough machines and people to meet demand.
  body: Real OEE and TEEP figures make it far more accurate than nameplate speeds. Hidden capacity often sits in the hours you don't run.
  articles:
  - oee-vs-teep
  - aps-vs-mes-scheduling
  see_also:
  - teep
  - finite-capacity-scheduling
- term: Digital transformation
  short: Changing how a business operates by using digital technology and data, not just adding software.
  body: Good technology is essential, but even the best system can be held back by poor processes or low adoption. Map the process first, and plan for adoption from the start.
  articles:
  - how-to-modernise-a-factory
  - manufacturing-change-management
  see_also:
  - smart-factory
  - change-management
- term: 5S
  slug: 5s
  short: 'A workplace organisation method: sort, set in order, shine, standardise and sustain.'
  body: 5S is often where lean starts on the shopfloor, because a tidy, organised workplace makes problems visible. Digital checklists and audits help it stick after the first enthusiasm fades.
  articles:
  - kaizen-and-mes
  - connected-worker-one-app-not-five
  see_also:
  - lean
  - kaizen
  - standard-work
- term: Six Sigma
  short: A data-driven method for reducing variation and defects, aiming for no more than 3.4 defects per million opportunities.
  body: Six Sigma lives or dies on data quality. Measurements captured automatically at the line, with context, make projects faster and their conclusions more trustworthy.
  articles:
  - spc-on-the-shopfloor
  - kaizen-and-mes
  see_also:
  - spc
- term: Just-in-time
  short: Producing and delivering only what's needed, at the moment it's needed.
  body: JIT relies on accurate, real-time inventory and consumption data. Without it, buffers creep back in to cover for uncertainty.
  articles:
  - wms-vs-mes-inventory
  - kaizen-and-mes
  see_also:
  - kanban
  - safety-stock
  - just-in-sequence
- term: Standard work
  short: The agreed, documented best way to do a task, used as the baseline for training and improvement.
  body: Without a standard, there can be no kaizen. Digital work instructions are how standard work reaches the operator at the moment it's needed.
  articles:
  - kaizen-and-mes
  - digital-work-instructions
  see_also:
  - digital-work-instructions
  - kaizen
- term: Root cause analysis
  short: Finding the underlying cause of a problem rather than treating its symptoms.
  body: 'Good traceability makes it far quicker: you can see that every failed part came from the same cavity, during the same two hours, when the temperature drifted.'
  articles:
  - manufacturing-traceability
  - qms-and-mes-quality
  see_also:
  - capa
- term: Continuous improvement
  short: The ongoing effort to improve processes in small, regular steps rather than occasional big projects.
  body: After go-live, it becomes the rhythm. The difference with good data is that each improvement can be measured and proved.
  articles:
  - mes-go-live
  - kaizen-and-mes
  see_also:
  - kaizen
  - pdca
  - lean
- term: KPI
  stands: Key performance indicator
  short: A measure that shows whether a process or business is meeting its goals.
  body: On the shopfloor, OEE gets the attention, but first-pass yield, OTIF, MTBF and changeover time matter too. Calculate them the same way everywhere.
  articles:
  - manufacturing-kpis-beyond-oee
  - mes-multi-site-rollout
  see_also:
  - oee
  - iso-22400
  - fpy
- term: Control plan
  short: A document listing the checks, methods, frequencies and reactions needed to keep a process producing good product.
  body: Control plans are standard in automotive. MES/MOM turns them from a document into checks that are triggered and recorded at the line.
  articles:
  - mes-in-regulated-industries
  - mes-functionality-quality
  see_also:
  - inspection-plan
  - ppap
- term: Process capability
  short: How well a process can produce output within its specification limits, usually expressed as Cp, Cpk, Pp or Ppk.
  body: Stability and capability are different questions. A stable process varies by the same amount around the same average, and SPC tells you whether that's true. Capability compares that variation with the specification limits. If the natural spread is wider than the tolerance, or sits too close to one limit, a perfectly stable process will still produce out-of-spec parts, predictably.
  articles:
  - spc-on-the-shopfloor
  see_also:
  - cpk
  - ppk
  - control-limits
  - specification-limits
- term: Defect
  short: A non-measurable flaw in a product, such as a scratch or dent, usually classed by severity.
  body: Recording defects by type and location, against the order and machine, is what turns a scrap count into something you can improve.
  articles:
  - mes-functionality-quality
  see_also:
  - non-conformance
  - scrap-rate
- term: Deviation
  short: A departure from an approved process or procedure, recorded and assessed in regulated manufacturing.
  body: In an electronic batch record, deviations are flagged as they happen rather than found days later during review.
  articles:
  - mes-in-regulated-industries
  see_also:
  - ebr
  - capa
  - review-by-exception
- term: ISO 9001
  short: The international standard for quality management systems.
  body: Most manufacturers are certified to it. Industry standards such as IATF 16949 and AS9100 build on top of it.
  articles:
  - qms-and-mes-quality
  see_also:
  - qms
  - iatf-16949
  - as9100
- term: Allergen management
  short: Controlling allergens through production so they don't contaminate products that shouldn't contain them.
  body: It shapes the schedule and the cleaning between runs. Sequencing allergen-free products first is a classic APS rule.
  articles:
  - food-and-beverage-manufacturing-challenges
  - aps-vs-mes-scheduling
  see_also: []
- term: Shelf life
  short: How long a product can be stored before it's no longer fit to sell or use.
  body: Shelf-life rules differ by product and drive how stock is picked. MES/MOM tracks expiry by lot so expired material can't be consumed.
  articles:
  - food-manufacturing-mes-barriers
  - mes-functionality-inventory
  see_also:
  - lot
- term: FIFO
  stands: First in, first out
  short: Using or shipping the oldest stock first.
  body: Simple in principle, and easy to break without location-level inventory tracking.
  articles:
  - mes-functionality-logistics
  see_also:
  - wms
  - fefo
  - lifo
- term: Give-away
  short: Product given away free by overfilling packs above their declared weight or volume.
  body: In food, small overfills across millions of packs add up to real money. Checkweigher data linked to the order makes it visible.
  articles:
  - food-and-beverage-manufacturing-challenges
  see_also:
  - yield
- term: Electronic signature
  short: A digital sign-off that legally links a person to a record, as defined by regulations such as 21 CFR Part 11.
  body: It has to be attributable and secure, and linked to the exact record and meaning of the signature.
  articles:
  - mes-in-regulated-industries
  see_also:
  - 21-cfr-part-11
  - ebr
- term: Audit trail
  short: A secure, time-stamped record of who changed data, when, and why.
  body: Regulated manufacturers must keep one for electronic records. It's also invaluable for working out what really happened in any factory.
  articles:
  - mes-in-regulated-industries
  see_also:
  - 21-cfr-part-11
- term: CoA
  stands: Certificate of analysis
  short: A document confirming that a batch meets its specification, with the test results.
  body: Usually produced from LIMS. Linking it to the batch genealogy means the right certificate goes with the right shipment.
  articles:
  - lims-and-mes
  see_also:
  - lims
  - batch-release
- term: High-mix low-volume
  short: Manufacturing many different products in small quantities.
  body: Changeovers become the biggest constraint on throughput, and work instructions have to change with every order.
  articles:
  - discrete-vs-process-manufacturing
  - manufacturing-kpis-beyond-oee
  see_also:
  - changeover
  - digital-work-instructions
- term: Utilisation
  short: The share of available time a resource is actually used.
  body: 'High utilisation isn''t always good: a busy non-bottleneck machine can just be building WIP. TEEP is the more useful measure for capacity decisions.'
  articles:
  - oee-vs-teep
  see_also:
  - teep
  - bottleneck
- term: Speed loss
  short: Running slower than the target rate, and the main driver of OEE performance losses.
  body: Speed losses are easy to miss because the line looks busy. Only counts against target cycle time reveal them.
  articles:
  - what-is-oee
  see_also:
  - performance
- term: Maintenance work order
  short: An instruction to carry out maintenance on an asset, with tasks, parts, labour and sign-off.
  body: Linking each work order to the stops it fixed is how you find out whether the repair worked.
  articles:
  - mes-functionality-maintenance
  - eam-cmms-and-mes
  see_also:
  - cmms
  - eam
  - mttr
- term: Spare parts
  short: Components kept in stock to repair equipment quickly.
  body: Spares usually live in maintenance stores managed in ERP or in the maintenance capability of MOM. Too few and repairs wait; too many and cash sits on shelves.
  articles:
  - eam-cmms-and-mes
  see_also:
  - cmms
  - eam
- term: Run to failure
  short: A deliberate choice to fix an asset only when it breaks.
  body: It's viable for cheap, non-critical assets where downtime doesn't significantly affect production. It becomes expensive when it's the default by accident.
  articles:
  - preventive-vs-predictive-maintenance
  see_also:
  - reactive-maintenance
- term: AS/RS
  slug: as-rs
  stands: Automated storage and retrieval system
  short: Automated equipment that stores and retrieves goods, such as stacker cranes and shuttle systems.
  body: Controlling warehouse automation is one of the clearest reasons to have a dedicated WMS.
  articles:
  - wms-vs-mes-inventory
  - mes-functionality-logistics
  see_also:
  - wms
  - agv
- term: AGV
  stands: Automated guided vehicle
  short: A driverless vehicle that moves material along defined routes.
  body: AGVs and their more flexible cousins, autonomous mobile robots, need to know what to move and where. That signal often comes from an operational system such as MES/MOM or WMS.
  articles:
  - wms-vs-mes-inventory
  - mes-functionality-logistics
  see_also:
  - line-side-replenishment
- term: Goods receipt
  short: Recording the arrival of purchased material, often with a quality check before it's released for use.
  body: It's where lot traceability starts. Capture the supplier lot at receipt, or you can't trace it later.
  articles:
  - mes-functionality-logistics
  - wms-vs-mes-inventory
  see_also:
  - lot
  - supplier-quality
- term: Putaway
  short: Moving material into its storage location when it first arrives in the warehouse.
  body: It covers raw materials arriving from suppliers and finished goods coming off the line. Putaway can be directed by ERP, WMS or MOM, depending on how complex the warehouse is.
  articles:
  - mes-functionality-logistics
  see_also:
  - wms
  - goods-receipt
- term: Picking
  short: Taking material from storage to fulfil a production order or shipment.
  body: Pick accuracy drives whether the line gets the right material. Scanning at pick and at the line closes the loop.
  articles:
  - mes-functionality-logistics
  - wms-vs-mes-inventory
  see_also:
  - wms
  - kitting
- term: Barcode
  short: A machine-readable label, one-dimensional or two-dimensional, used to identify items, lots and locations.
  body: Scanning instead of typing is the simplest error-proofing on any shopfloor.
  articles:
  - mes-functionality-inventory
  - lot-vs-serial-traceability
  see_also:
  - data-matrix
  - rfid
- term: Data matrix
  short: A compact two-dimensional code that can be printed or engraved on small parts.
  body: It's common for marking individual parts with a serial number, because it survives harsh environments when engraved.
  articles:
  - lot-vs-serial-traceability
  see_also:
  - barcode
  - serialisation
- term: RFID
  stands: Radio-frequency identification
  short: Tags that can be read by radio without line of sight, used to identify and track items.
  body: Useful for tracking inventory and returnable assets such as containers. As tagged items pass readers, their location is updated automatically, and readers in more than one place can tell which way they're moving, such as into or out of a warehouse. The data still needs context in MES/MOM to mean anything.
  articles:
  - mes-functionality-inventory
  - mes-functionality-tooling
  see_also:
  - barcode
  - traceability
- term: Sensor
  short: A device that measures a physical property, such as temperature or vibration, and turns it into a signal.
  body: Sensors produce data; context makes it useful. Start with the sensors that tell you about your bottleneck.
  articles:
  - contextualised-manufacturing-data
  - predictive-maintenance-data
  see_also:
  - iiot
  - plc
  - historian
- term: Gateway
  short: A device or software that translates between industrial protocols, or between the plant network and other systems.
  body: Gateways let older equipment take part in OPC UA or MQTT architectures without replacing the controller.
  articles:
  - opc-ua-mqtt-uns-explained
  - iiot-vs-mes
  see_also:
  - opc-ua
  - edge
- term: Smart manufacturing
  short: Using connected systems and data to make manufacturing more efficient and flexible.
  body: It's the practice; the smart factory is the place. Both rest on defined processes and trustworthy shopfloor data.
  articles:
  - what-is-a-smart-factory
  - time-to-truth
  see_also:
  - smart-factory
  - industry-4-0
- term: Simulation
  short: Modelling a process or factory on a computer to test changes before making them for real.
  body: Discrete event simulation is the common type for factory flow. A digital twin adds a live link to the real factory.
  articles:
  - mes-and-digital-twins
  see_also:
  - digital-twin
- term: FEFO
  stands: First expired, first out
  short: Using or shipping the stock with the earliest expiry date first.
  body: Standard in food, beverage and pharma, where shelf life matters more than the date stock arrived. It depends on expiry dates being captured accurately at receipt and production, then enforced at the point of picking or consumption.
  articles:
  - mes-functionality-logistics
  - food-and-beverage-manufacturing-challenges
  see_also:
  - fifo
  - shelf-life
- term: LIFO
  stands: Last in, first out
  short: Using the most recently received stock first.
  body: Less common for physical stock movement, but practical where material is stored so the newest is easiest to reach, such as bulk material in a heap. LIFO is also an inventory valuation method in some accounting rules, which is a separate question from how material physically moves.
  articles:
  - mes-functionality-logistics
  see_also:
  - fifo
  - fefo
- term: FTTQ
  stands: First time through quality
  short: The percentage of units that complete a process right first time, without being scrapped, reworked, retested or repaired.
  body: It's often used interchangeably with first-pass yield. Some manufacturers, particularly in automotive, use FTTQ across a whole process and count any repair or retest as a failure, so agree the definition before comparing numbers across sites.
  articles:
  - first-pass-yield-vs-rolled-throughput-yield
  - manufacturing-kpis-beyond-oee
  see_also:
  - fpy
  - rty
- term: Just-in-sequence
  short: Delivering parts to the line in the exact order they'll be used, as well as at the right time.
  body: Common in automotive, where each vehicle on the line can be different. Suppliers and line-side logistics need the build sequence from MES/MOM, and any change to it has to reach them in time.
  articles:
  - wms-vs-mes-inventory
  - mes-functionality-logistics
  see_also:
  - just-in-time
  - line-side-replenishment

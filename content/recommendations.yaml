    quote: "Matt possesses a deep understanding of the MES landscape"
    text: |
      I have had the privilege of working closely with Matt over the past 2 years, as he manages our MES (Manufacturing Execution Systems) product at Infor, and I can confidently say that Matt is an exceptional MES Product Manager.

      Matt possesses a deep understanding of the MES landscape, and his strategic vision for product development is truly impressive. He has an innate ability to identify emerging trends and technologies in the manufacturing industry, ensuring that our MES product remains cutting-edge and competitive.

      One of Matt's standout qualities is his commitment to customer success. He consistently goes above and beyond to address client concerns and tailor our MES solutions to meet their specific needs. His dedication to customer satisfaction has resulted in long-lasting, mutually beneficial relationships.

      Moreover, Matt is a natural leader who inspires his team to reach new heights. He has fostered a culture of innovation, collaboration, and excellence within our product team, which translates into tangible results and successful product launches.

      In summary, Matt is an outstanding MES Product Manager with a proven track record of driving product innovation, satisfying customers, and leading high-performing teams. I have no doubt that his future endeavors will be marked by continued success and contributions to the MES industry.

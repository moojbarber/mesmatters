  - id: garry-marshall
    name: Garry Marshall
    title: Retired
    date: September 2023
    relation: Garry managed Matt directly
    quote: "Matt is one of just a few people I know to be so knowledgeable on the role and function of MES"
    text: |
      I have worked with Matt for over 12 years. For 3 of those, Matt reported in to me as Head of Product at Lighthouse, helping to stear Shopfloor-Online (as-was - now Infor MES) to become a key player in the Manufacturing Execution System (MES) space. For the last couple of years I have continued to work alongside Matt as we have moved in to Infor.

      Matt is impassioned about the role of the MES. He bring clarity of thought, strategic vision and unbounded energy to drive out the MES message. Matt is a driving force behind MES both inside Infor and beyond.

      Matt is one of just a few people I know to be so knowledgeable on the role and function of MES - his background in both software implementation, system architecture and deployment, and strategic product management puts him in a unique position to be able to articulate powerfully the benefits that can come from the appropriate implementation of MES.

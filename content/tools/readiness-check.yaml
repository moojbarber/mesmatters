# Smart factory readiness check. Five areas, four statements each, scored 1 to 5.
# Stages follow the time-to-truth article: how long until the right person knows what happened, with context.
levels:
  - n: 1
    name: Eventually
    state: Paper and Excel
    line: Paper on the floor and spreadsheets in the office. The truth gets typed up eventually, by which time the detail has gone.
    next: Get the basics visible. Map how one order really flows and agree what you'll measure. Then take the paper off one line. Don't buy anything until the process map is on the wall.
    read: [manufacturing-process-mapping, smart-factory-where-to-start, paperless-manufacturing]
  - n: 2
    name: End of hour or shift
    state: ERP on the shopfloor
    line: Production and scrap booked into ERP every hour or shift. You know how many and what it cost, but not why.
    next: Keep ERP doing what it does well, and add a shopfloor layer for what happens between an order starting and finishing. Start where the unexplained losses are biggest.
    read: [mes-vs-erp, mes-business-case, mes-mom-erp-compared]
  - n: 3
    name: After the fact
    state: Digitalised
    line: Tablets and point solutions. Faster than paper, but still typed in by hand after the event, and the tools don't talk to each other.
    next: This is where most of the value is waiting. Getting to "right now" is usually the biggest single jump, because it's where the data becomes trustworthy. Check that what you've already bought can grow into an integrated platform, rather than adding another island.
    read: [mes-business-case, shopfloor-applications-explained, how-to-choose-an-mes]
  - n: 4
    name: Right now
    state: Automatic data capture
    line: MES/MOM captures what happens as it happens, from the machine and the operator, with the context attached.
    next: Widen the architecture. Connect PLM, scheduling, quality and your data platform deliberately, so there's one source of truth beyond the shopfloor. This is also the stage where AI on operational data finally has something to learn from.
    read: [isa95-integration-patterns, contextualised-manufacturing-data, ai-ml-genai-on-the-shopfloor]
  - n: 5
    name: Before it happens
    state: Harmonious systems
    line: The whole stack works as one architecture. Trends raise warnings early, and maintenance and quality move from reacting to preventing.
    next: Pick the AI use cases with a measurable payback and run them on the foundation you've built. Keep the template disciplined as you add sites, because this stage is easy to lose one local customisation at a time.
    read: [predictive-maintenance-data, mes-multi-site-rollout, agentic-ai-mcp-manufacturing]
  - n: 6
    name: Without asking
    state: Agentic and AI
    line: AI agents act on trusted data, inside clear guardrails. People set the rules and handle the exceptions.
    next: Very few factories are genuinely here. If your scores say you are, ask two colleagues from different departments to take the check too. If they agree, write it up. I'd like to read it.
    read: [the-future-of-smart-manufacturing-harnessing-the-power-of-mes-intelligence, manufacturing-kpis-beyond-oee]

areas:
  - id: process
    name: Process
    read: manufacturing-process-mapping
    advice: Your slowest area is process. Technology on top of an undocumented process just makes the mess faster. Map the as-is with the people who do the work, then standardise before you configure anything.
    items:
      - q: How well are your processes documented?
        lo: They live in people's heads
        hi: Documented end to end and used to train people
      - q: Do shifts and sites work the same way?
        lo: Every shift does it differently
        hi: One standard, with local variation that's agreed and justified
      - q: What happens when something goes wrong?
        lo: Workarounds and firefighting
        hi: Guided exception handling with a clear owner
      - q: How do you decide what to improve?
        lo: Gut feel, or whoever shouts loudest
        hi: Data-driven reviews built into the daily and weekly routine
  - id: data
    name: Data
    read: contextualised-manufacturing-data
    advice: "Your slowest area is data. Everything else, including any AI plans, depends on it. Focus on automatic capture at the point of work, and on giving every number its context: the order, the material, the operator and the reason."
    items:
      - q: How is production data captured?
        lo: On paper, or typed in later
        hi: Automatically, from equipment and operators, checked at source
      - q: How quickly can you see it?
        lo: Days or weeks after the event
        hi: As it happens
      - q: Does a number come with its context?
        lo: A count with no link to the order or the reason
        hi: Every event linked to order, material, operator, shift and reason
      - q: Do people agree on the numbers?
        lo: Each department has its own version
        hi: One trusted source. Nobody argues about whose figures are right
  - id: systems
    name: Systems
    read: shopfloor-applications-explained
    advice: Your slowest area is systems. The shopfloor is probably running on paper, spreadsheets and a few disconnected tools. Start from the problems, work out which capabilities you need and where each should live, then look at platforms.
    items:
      - q: What runs the shopfloor today?
        lo: Paper and spreadsheets
        hi: MES/MOM covering production, quality, inventory and maintenance
      - q: How do orders and confirmations move between ERP and the floor?
        lo: Re-keyed by hand
        hi: Automated, two-way, with clear ownership of master data
      - q: How many machines are connected?
        lo: None
        hi: Most of them, with machine data put in context
      - q: How many systems does an operator use to finish one task?
        lo: Several, plus paper
        hi: One interface, with instructions and checks built in
  - id: people
    name: People
    read: manufacturing-change-management
    advice: Your slowest area is people. This is the hardest part of every programme I've seen, and the one that's easiest to underfund. Find a visible sponsor and give someone the job full time. Then bring operators in from the first workshop, not the last.
    items:
      - q: Who sponsors the programme?
        lo: Nobody, or nobody senior
        hi: A visible sponsor with a vision tied to business outcomes
      - q: Who owns the work?
        lo: It's done on the side of day jobs
        hi: A dedicated team with the right skills, and time protected for it
      - q: How involved are operators?
        lo: Changes are imposed on them
        hi: They help design and test the system
      - q: What happens when a key person is off?
        lo: Things wobble. They're a single point of failure
        hi: Knowledge is built into systems and training
  - id: analytics
    name: Analytics and AI
    read: ai-ml-genai-on-the-shopfloor
    advice: Your slowest area is analytics and AI. That's normal, and usually the right order of things. Get KPIs calculated automatically and consistently first. GenAI on your documents can start now, but AI that learns from operational data needs the foundation underneath it.
    items:
      - q: How are KPIs like OEE calculated?
        lo: Estimated at the end of the shift, if at all
        hi: Automatically, with the same definition on every line
      - q: How do people know what's happening right now?
        lo: Walk the floor and ask
        hi: Live dashboards for each role, from operator to plant manager
      - q: How is maintenance planned?
        lo: Fix it when it breaks
        hi: Condition-based and predictive, driven by equipment data
      - q: Where is AI today?
        lo: No data foundation to support it
        hi: Embedded in operations, with use cases running on reliable data

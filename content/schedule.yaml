# Weekly newsletter feature order.
#
# Every article is on the site from launch (publish_all_now: true). Each Tuesday,
# starting on `start`, the next article in this list is emailed to newsletter
# subscribers via Kit, and it's the article that week's social posts point to.
#
# To reorder, just move lines around. Set publish_all_now to false to go back to
# releasing one article a week on the site as well.
publish_all_now: true
start: 2026-11-10        # a Tuesday
send_time: "08:00"       # UK time the email goes out

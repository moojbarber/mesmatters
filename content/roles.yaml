  - id: operator
    group: floor
    name: Operator
    title: Machine or line operator
    horizon: [4, 4]
    question: "What do I make next, and who helps me when something goes wrong?"
    summary: "Operators do the work that everything else depends on. The best shopfloor systems make their job easier, not just better recorded."
    cares: [["Making it right first time", fpy], ["A smooth shift", null], ["Getting help quickly", andon], ["Clear instructions", digital-work-instructions]]
    challenges:
      - ["Paper and double entry", "Writing the same numbers on paper and then into a screen."]

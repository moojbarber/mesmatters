one_event:
  title: "One stoppage, seen by every role"
  intro: "A filler stops for 14 minutes at 02:10. The same event looks very different depending on who's looking. With connected operations, they're all working from the same facts."
  views:
    - [operator, "Clears the jam, and selects the reason on the screen in two taps."]
    - [supervisor, "Sees the line stop live, and checks whether the shift can still hit its target."]
    - [technician, "Gets the fault with the alarm history attached, and sees it's the third this week."]
    - [maintenance-manager, "Sees MTBF on the filler falling, and brings forward a planned repair."]
    - [planner, "Sees the order will finish 20 minutes late, and adjusts the next job."]
    - [plant-manager, "Sees the stop in the morning's top losses, already agreed by everyone."]
    - [cfo, "Sees the cost of the lost output in the month's numbers, with no reconciliation."]

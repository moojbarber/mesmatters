    path: beyond-erp

  - id: engineer
    group: func
    name: Process engineer
    title: Manufacturing or process engineer
    horizon: [2, 4]
    question: "Is the process running the way it was designed, and when it isn't, why not?"
    summary: "Engineers design and improve the process. They need detailed data linked to products and recipes, and a quick way to get changes onto the shopfloor."
    cares: [["Process capability", process-capability], ["Yield", yield], ["Cycle time", cycle-time], ["Engineering change speed", change-management]]
    challenges:
      - ["Data without context", "Historian trends show what a value did, but not which order or material was involved."]
      - ["Slow engineering changes", "Getting a new revision onto every workstation takes too long and isn't always complete."]
      - ["Recipes and parameters on paper", "Settings are entered manually, with room for error."]
      - ["New product introductions", "Ramp-up takes longer than planned because problems are found late."]
    scores: {prod: 4, qual: 5, trace: 4, inv: 2, maint: 3, cw: 4, sched: 2, ai: 5, energy: 3}
    why:
      ai: "Process data linked to the order and the outcome is what analytics and AI need to find root causes."
      qual: "SPC and capability data from the line show where the process drifts."
      cw: "Digital work instructions mean an engineering change reaches every workstation at once."
      trace: "As-built records show exactly what went into each unit, for investigations and ramp-up."
    shift:
      - ["Correlating spreadsheets by timestamp", "Process data already linked to the order and the lot"]
      - ["A revision change that takes days to reach the floor", "A revision live at every station as soon as it's released"]
    pitch: "Show how long investigations and engineering changes take today. Linked data and digital instructions shorten both, which speeds up every new product introduction."

  - id: ot-architect
    group: func
    name: IT/OT architect
    title: IT/OT architect or OT manager
    horizon: [1, 3]
    question: "How do we connect every machine and system reliably and securely, in a way we can support for ten years?"
    summary: "Architects and OT managers make the connections work. They balance the shopfloor's need for availability with the business's need for data, and live with every integration decision for years."
    cares: [["Uptime of shopfloor systems", null], ["Number of interfaces", point-to-point-integration], ["Security posture", iec-62443], ["Data latency", null]]
    challenges:

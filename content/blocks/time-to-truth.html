  <div class="ttt-panel" id="ttt-panel" aria-live="polite">
    <p class="ttt-hint">Tap a stage to see what the factory and its systems look like.</p>
    <div class="ttt-info" data-s="1" hidden><span class="micro">Stage 1 · Paper and Excel</span><h4>The truth arrives eventually</h4><div class="ttt-cols"><p><b>The factory.</b> Paper travellers and whiteboards on the floor, and spreadsheets in the office with macros only one person understands.</p><p><b>The truth.</b> Written down by hand and typed up whenever someone gets round to it, if at all. By then the detail has gone, and every department has its own version of the number.</p><p><b>AI value: negligible.</b> AI can help you read the data you have, but it can't analyse what was never captured. <i>For example:</i> an AI assistant on a spreadsheet tidies it up and charts it more clearly.</p><p><b>To move on.</b> Map how one order really flows. Then take the paper off one line.</p></div></div>
    <div class="ttt-info" data-s="2" hidden><span class="micro">Stage 2 · ERP on the shopfloor</span><h4>The truth arrives when the booking goes in</h4><div class="ttt-cols"><p><b>The factory.</b> Production and scrap typically booked into ERP at a terminal every hour, or at the end of the job or shift. ERP knows the order started and finished.</p><p><b>The truth.</b> Posted when someone books it. You know how many, and what it cost. You don't know why, because watching what happens in between isn't ERP's job.</p><p><b>AI value: small.</b> AI can find trends in transactional data and forecast from them, but it sees totals rather than causes. <i>For example:</i> flagging a product whose scrap cost is creeping up across orders.</p><p><b>To move on.</b> Keep ERP doing what it does well: planning, costing, purchasing and the business record. Add a shopfloor layer for everything between start and finish.</p></div></div>
    <div class="ttt-info" data-s="3" hidden><span class="micro">Stage 3 · Digitalised</span><h4>The truth arrives after the fact</h4><div class="ttt-cols"><p><b>The factory.</b> Tablets and digital forms, and a point solution for each department. Better than paper, but people still type the numbers in and the tools don't talk to each other.</p><p><b>The truth.</b> Entered after the event, by hand, from memory or a note. Rounded, and missing the short stops and the order it belonged to.</p><p><b>AI value: modest.</b> AI can make sense of data people enter by hand and spot patterns across disconnected tools, though it's held back by data that's rounded and late. <i>For example:</i> grouping free-text downtime notes into common causes.</p><p><b>To move on.</b> Capture from the machine and the scanner, not the keyboard, on a platform that can grow beyond one problem.</p></div></div>
    <div class="ttt-info" data-s="4" hidden><span class="micro">Stage 4 · Automatic data capture</span><h4>The truth arrives right now</h4><div class="ttt-cols"><p><b>The factory.</b> MES/MOM as the operational backbone, with machines connected. Operators work from one screen with instructions and checks built in.</p><p><b>The truth.</b> Captured as it happens, with the order and reason attached. Nobody argues about the numbers any more.</p><p><b>AI value: significant.</b> AI can learn from your own operations, spotting anomalies and finding root causes, because every event arrives with its context. <i>For example:</i> a copilot that explains why Line 3 stopped from the facts, not a guess.</p><p><b>To move on.</b> Connect the wider stack deliberately, so planning, engineering, quality and maintenance work from the same data.</p></div></div>
    <div class="ttt-info" data-s="5" hidden><span class="micro">Stage 5 · Harmonious systems</span><h4>The truth arrives before it happens</h4><div class="ttt-cols"><p><b>The factory.</b> ERP, MES/MOM, PLM, scheduling, quality and a data platform working as one architecture. Each system does its own job and shares what it knows.</p><p><b>The truth.</b> Trends raise warnings early. Maintenance is planned because the data says so, not because the calendar does.</p><p><b>AI value: high.</b> AI can predict and optimise across the whole stack, because planning, engineering, quality and maintenance data finally line up. <i>For example:</i> maintenance planned from a bearing's condition, and the schedule adjusted around it.</p><p><b>To move on.</b> Pick the AI use cases with a measurable payback, and set the guardrails before you let anything act.</p></div></div>
    <div class="ttt-info" data-s="6" hidden><span class="micro">Stage 6 · Agentic, human in the loop</span><h4>The truth gets acted on before anyone asks</h4><div class="ttt-cols"><p><b>The factory.</b> AI agents working on trusted, contextualised data. They prepare the decision and the paperwork, and a person approves it.</p><p><b>The truth.</b> Turned into a ready-made action in seconds. People stay in control, and approve with the facts in front of them.</p><p><b>AI value: very high.</b> AI moves from advising to preparing the action, so people decide in seconds rather than hours. <i>For example:</i> an agent sees the bearing trend, raises the maintenance work order with the spare part reserved, and books it into the next planned stop for a supervisor to approve.</p><p><b>To move on.</b> Track which recommendations people approve unchanged. Those are the candidates for autonomy, one decision at a time.</p></div></div>
    <div class="ttt-info" data-s="7" hidden><span class="micro">Stage 7 · Autonomous</span><h4>The truth gets acted on without asking</h4><div class="ttt-cols"><p><b>The factory.</b> Agents make routine decisions on their own, inside limits the business has agreed. People set the rules and handle the exceptions.</p><p><b>The truth.</b> Acted on as it arrives. People hear about the decisions that matter, and review the rest when they choose.</p><p><b>AI value: highest.</b> AI acts within agreed limits, and each decision it takes frees people for the ones that need judgement. <i>For example:</i> an agent re-sequences tomorrow's schedule around a late delivery and tells the planner what changed.</p><p><b>Honestly.</b> Very few factories are here yet, whatever the marketing says. Autonomy is earned decision by decision, on top of every stage before it.</p></div></div>
  </div>
  <figcaption id="ttt-cap"><b>Time to truth.</b> How long it takes your factory to know what really happened, with enough context to act on it. Each stage builds on the one before, and the value AI can add grows with every one.</figcaption>

        <path class="imap-edge" data-app="wms" data-route="mes" d="M812,108 C710,108 740,262 670,262"/>

        <text x="500" y="90" class="t2">Runs the business</text>

        <ellipse cx="500" cy="320" rx="230" ry="170" fill="url(#imapGlow)" class="halo"/>

        <text x="500" y="246" class="t2">Runs the operation, on one set of data</text>

      <g class="imap-app imap-mod" data-app="mes" tabindex="0" role="button" aria-label="MES, production"><rect x="346" y="260" width="150" height="76" rx="14"/><text x="421" y="294" class="t1">MES</text><text x="421" y="313" class="t2">Production</text></g>
      <g class="imap-app imap-mod" data-app="qms" tabindex="0" role="button" aria-label="QMS, quality"><rect x="504" y="260" width="150" height="76" rx="14"/><text x="579" y="294" class="t1">QMS</text><text x="579" y="313" class="t2">Quality</text></g>
      <g class="imap-app imap-mod" data-app="ims" tabindex="0" role="button" aria-label="IMS, inventory"><rect x="346" y="346" width="150" height="76" rx="14"/><text x="421" y="380" class="t1">IMS</text><text x="421" y="399" class="t2">Inventory</text></g>
      <g class="imap-app imap-mod" data-app="cmms" tabindex="0" role="button" aria-label="CMMS, maintenance"><rect x="504" y="346" width="150" height="76" rx="14"/><text x="579" y="380" class="t1">CMMS</text><text x="579" y="399" class="t2">Maintenance</text></g>
      <g class="imap-floor">
        <rect x="270" y="560" width="460" height="52" rx="14"/>
        <text x="500" y="583" class="t1">Machines, PLCs and people</text>
        <text x="500" y="601" class="t2">OPC UA, MQTT and other protocols</text>
      </g>

      <g class="imap-app" data-app="plm" tabindex="0" role="button" aria-label="PLM"><rect x="36" y="80" width="152" height="56" rx="14"/><text x="112" y="106" class="t1">PLM</text><text x="112" y="123" class="t2">Product definition</text></g>
      <g class="imap-app" data-app="cpq" tabindex="0" role="button" aria-label="CPQ"><rect x="36" y="210" width="152" height="56" rx="14"/><text x="112" y="236" class="t1">CPQ</text><text x="112" y="253" class="t2">Configure and quote</text></g>
      <g class="imap-app" data-app="aps" tabindex="0" role="button" aria-label="APS"><rect x="36" y="340" width="152" height="56" rx="14"/><text x="112" y="366" class="t1">APS</text><text x="112" y="383" class="t2">Advanced scheduling</text></g>
      <g class="imap-app" data-app="lims" tabindex="0" role="button" aria-label="LIMS"><rect x="36" y="470" width="152" height="56" rx="14"/><text x="112" y="496" class="t1">LIMS</text><text x="112" y="513" class="t2">Regulated labs</text></g>
      <g class="imap-app" data-app="wms" tabindex="0" role="button" aria-label="WMS"><rect x="812" y="80" width="152" height="56" rx="14"/><text x="888" y="106" class="t1">WMS</text><text x="888" y="123" class="t2">Complex warehousing</text></g>
      <g class="imap-app" data-app="eam" tabindex="0" role="button" aria-label="EAM"><rect x="812" y="210" width="152" height="56" rx="14"/><text x="888" y="236" class="t1">EAM</text><text x="888" y="253" class="t2">Asset lifecycle</text></g>
      <g class="imap-app" data-app="cw" tabindex="0" role="button" aria-label="Connected worker"><rect x="812" y="340" width="152" height="56" rx="14"/><text x="888" y="366" class="t1">Connected worker</text><text x="888" y="383" class="t2">Frontline apps</text></g>
      <g class="imap-app" data-app="data" tabindex="0" role="button" aria-label="Data platform and AI"><rect x="812" y="470" width="152" height="56" rx="14"/><text x="888" y="496" class="t1">Data and AI</text><text x="888" y="513" class="t2">Analytics and models</text></g>

  <div class="imap-legend" aria-hidden="true"><span class="lg-erp">Via ERP</span><span class="lg-mes">Direct to MOM</span><span class="lg-core">Orders down, actuals up</span></div>
  <div class="imap-info" aria-live="polite">
    <p class="imap-hint">Pick an application, or a part of MOM, to see what it does, where it overlaps and what flows where.</p>
  </div>
  <script type="application/json" class="imap-data">{
    "modes": {
      "erp": {"note": "Every specialist talks to ERP, and ERP passes what it needs down to MOM. One integration hub, simple to govern, and often the safest choice for transactional data. The catch: real-time shopfloor data waits for ERP, and ERP ends up holding detail it doesn't need.",
              "routes": {"plm": ["erp"], "cpq": ["erp"], "aps": ["erp"], "lims": ["erp"], "wms": ["erp"], "eam": ["erp"], "cw": ["erp"], "data": ["erp"]}},
      "hybrid": {"note": "The pattern I see work best. ERP is the backbone for business data: orders, costs and master data. Execution data, such as schedules, results, instructions and events, goes straight to MOM. Each system owns what it's good at.",
              "routes": {"plm": ["erp", "mes"], "cpq": ["erp", "mes"], "aps": ["erp", "mes"], "lims": ["mes"], "wms": ["erp", "mes"], "eam": ["erp", "mes"], "cw": ["mes"], "data": ["erp", "mes"]}},
      "mes": {"note": "Specialists connect straight to MOM, which becomes the operational hub and reports up to ERP. Fast and real-time. It needs clear ownership of master data, or you end up with two versions of the truth.",
              "routes": {"plm": ["mes"], "cpq": ["mes"], "aps": ["mes"], "lims": ["mes"], "wms": ["mes"], "eam": ["mes"], "cw": ["mes"], "data": ["mes"]}}
    },
    "apps": {
      "mes": {"name": "MES: production", "module": true, "what": "The production part of MOM: dispatching orders, recording counts, scrap and downtime as they happen, OEE, and guided work instructions.",
              "erp": "ERP plans and costs the order, and some ERPs record operation completions. MES captures the detail in real time and reports actuals back.",
              "mes": "Paper, spreadsheets and standalone point solutions such as OEE dashboards.",
              "link": "/post/mes-functionality-production", "read": "MES functionality: production monitoring"},
      "qms": {"name": "QMS: quality", "module": true, "what": "Quality on the line: inspection plans, sampling triggered by events, SPC, goods-in inspection, holds and batch release, all with full production context.",
              "erp": "Serious non-conformances and CAPA escalate into ERP, along with supplier issues and quality costs. ERP holds the stock status.",
              "mes": "A separate enterprise QMS, for most manufacturers. With MOM and ERP working together, it adds little.",
              "link": "/post/qms-vs-lims-vs-mes", "read": "QMS vs LIMS vs MES"},
      "ims": {"name": "IMS: inventory", "module": true, "what": "Inventory on the shopfloor: receiving, line-side stock, material validated at the point of use, consumption by lot and serial, labels, FIFO and FEFO.",
              "erp": "ERP owns stock as a financial asset. MOM keeps it accurate with actual consumption instead of backflushed estimates.",
              "mes": "Backflushing, pre-printed labels and manual stock counts. A WMS is still the right choice for the most complex warehousing and distribution centres.",
              "link": "/post/mes-functionality-inventory", "read": "MES functionality: inventory"},
      "cmms": {"name": "CMMS: maintenance", "module": true, "what": "Maintenance on the same data as production: operator requests, work orders, preventive maintenance on actual run hours, and spare parts.",
              "erp": "ERP holds the asset register, depreciation, capital spend and maintenance costs. A full EAM only for asset-heavy businesses with advanced needs.",
              "mes": "A separate CMMS, and the second version of downtime that comes with it.",
              "link": "/post/mes-functionality-maintenance", "read": "MES functionality: maintenance"},
      "plm": {"name": "PLM", "what": "Owns the product definition: designs, specifications, the engineering BOM and changes.",
              "erp": "The engineering BOM becomes a manufacturing BOM and routing in ERP, then flows down to MOM with each order.",
              "mes": "Drawings, work instructions and change notices go straight to the shopfloor, so operators always see the latest revision.",
              "link": "/post/plm-erp-mes-digital-thread", "read": "PLM, ERP and MES"},
      "cpq": {"name": "CPQ", "what": "Configures complex products and prices them correctly.",
              "erp": "The configured order lands in ERP with its pricing, and ERP plans and costs it.",
              "mes": "The buildable configuration (options, parameters, test limits) reaches MOM so the line builds exactly what was sold.",
              "link": "/post/cpq-to-shopfloor", "read": "CPQ to shopfloor"},
      "aps": {"name": "APS", "what": "Builds detailed, constraint-based schedules when scheduling gets genuinely hard. Not every manufacturer needs one: ERP planning plus MOM's own sequencing is often enough.",
              "erp": "Takes demand and orders from ERP and returns planned dates.",
              "mes": "Sends the sequenced schedule to MOM and gets real progress back, so the next schedule starts from reality.",
              "link": "/post/aps-vs-mes-scheduling", "read": "APS vs ERP scheduling"},
      "lims": {"name": "LIMS", "what": "Runs a heavy, regulated lab, mostly in pharma and biotech, chemicals, food and dairy with their own labs, and materials testing. Most manufacturers don't need one: MOM handles sampling, goods-in testing and batch release.",
               "erp": "Certificates and release status can pass to ERP for shipping and stock status.",
               "mes": "Sample requests and results are tied to the batch and the process step in MOM, which can hold or release product in real time.",
               "link": "/post/lims-and-mes", "read": "LIMS and MES"},
      "wms": {"name": "WMS", "what": "The most advanced option, for the most complex warehousing and distribution centres: storage strategies, picking, automation and docks. Elsewhere, ERP and MOM's inventory management cover the ground.",
              "erp": "Stock levels, receipts and shipments are reconciled with ERP for valuation and orders.",
              "mes": "Material is staged and replenished to the line from what MOM says it's about to consume.",
              "link": "/post/wms-vs-mes-inventory", "read": "WMS vs MES vs ERP"},
      "eam": {"name": "EAM", "what": "Manages the asset lifecycle and its costs, for asset-heavy businesses with advanced needs: complex spares, reliability engineering, linear assets and regulatory asset records across many sites. ERP often covers the asset finances, and MOM covers day-to-day maintenance.",
              "erp": "Asset values, spares purchasing and maintenance costs live with ERP.",
              "mes": "Run hours, counts and downtime from MOM trigger condition-based work, and maintenance windows feed back into the schedule.",
              "link": "/post/cmms-vs-eam-vs-mes", "read": "CMMS vs EAM vs MES"},
      "cw": {"name": "Connected worker", "what": "Puts instructions, checklists, skills and handover in front of frontline people. Best built into MOM, on the same data.",
             "erp": "Bought standalone and wired to ERP, it knows the order but not what the line is actually doing.",
             "mes": "Built into or tightly linked with MOM, every checklist and instruction knows the order, the machine and the operator.",
             "link": "/post/connected-worker-one-app-not-five", "read": "Connected worker"},
      "data": {"name": "Data and AI", "what": "A data platform brings shopfloor and business data together for analytics and AI. AI and the data foundation are best built together.",
             "erp": "Business data: orders, costs, customers and suppliers.",
             "mes": "Contextualised operational data from MOM, every event tied to its order, material, machine and operator. That context is what makes AI useful.",
             "link": "/post/manufacturing-data-platforms", "read": "Where shopfloor data lives"}
    }
  }</script>
</figure>

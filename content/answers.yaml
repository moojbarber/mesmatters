# Answer-first summaries shown in the box at the top of each article,
# and used in schema, llms.txt and the RSS feed.
# Keyed by article slug. Optional: label (defaults to "Summary"), faq, reviewed.
# Rules: 40-60 words, the answer first, written as Matt, nothing invented.

what-is-mes:
  summary: "MES, a manufacturing execution system, runs production: dispatching orders and recording output and downtime as they happen. MOM, manufacturing operations management, covers the whole operation that ISA-95 defines, from production and quality to inventory and maintenance, on the same data. The difference decides what you buy, and whether everyone in operations works from one version of the truth."
  faq:
    - q: "What does MES stand for?"
      a: "MES stands for manufacturing execution system. It's the software that gets the right order onto the right line and records what actually happened, including output and downtime, ideally straight from the equipment. It sits between ERP, which plans the business, and the machines and control systems on the shopfloor."
    - q: "What is the difference between MES and MOM?"
      a: "MES is the production pillar. MOM, manufacturing operations management, covers the four areas ISA-95 defines for manufacturing operations, which are production, quality, inventory and maintenance, on one set of data. MES is one part of MOM. When a vendor says their MES covers everything, ask which of the four areas it actually handles, and how deeply."
    - q: "Why does MES/MOM matter for AI?"
      a: "AI needs accurate, contextualised data collected over time. A machine signal that says stopped means little on its own. MES/MOM adds the order, the material, the shift and the reason, which turns raw signals into data a model can learn from. The broader the scope, the richer that context."

mes-vs-mom:
  summary: "MES runs production: orders, counts, scrap, downtime and OEE. MOM covers all four areas ISA-95 defines for manufacturing operations, which are production, quality, inventory and maintenance, on one platform. MES is one part of MOM, not a synonym for it, and buying a separate system per pillar usually leaves you reconciling them forever."
  faq:
    - q: "Is MES the same as MOM?"
      a: "No, although the terms are used interchangeably, including by vendors and, in the past, by me. MES describes production execution. MOM describes the whole operation across production, quality, inventory and maintenance. MES is one part of MOM rather than another name for it, and the distinction matters most when you're deciding what to buy."
    - q: "Where did the term MOM come from?"
      a: "MES is the original term, from when systems focused on releasing orders, running them and recording what happened. As the best systems grew into quality, traceability, maintenance, logistics, tooling and energy, \"execution system\" no longer described what they did. MOM emerged as the more accurate name, and it lines up with the four areas of manufacturing operations defined in ISA-95."
    - q: "Should I buy a separate system for each pillar?"
      a: "It looks sensible on paper, but in practice context gets lost at every integration boundary and operators end up juggling applications. You also pay to retest each integration whenever either side upgrades. A dedicated system is sometimes the right call, for a complex warehouse or a heavy asset business, but make that a deliberate decision about depth rather than the default."

what-is-erp:
  summary: "ERP runs the business side of a manufacturer on one set of data: finance, sales orders, purchasing, planning, inventory and costing. A good one is worth every bit of effort. It plans and accounts for production rather than running it minute by minute, which is where specialist applications such as MES/MOM complement it."
  faq:
    - q: "What does ERP do in a manufacturing company?"
      a: "ERP runs the business side on one shared set of data. It records customer orders, plans what to make and buy through MRP, raises purchase orders, values inventory, costs production, invoices customers and posts every transaction to the ledger. In manufacturing it's where production is planned and accounted for: what should be made, from what, at what cost and by when."
    - q: "What doesn't ERP do?"
      a: "ERP isn't designed to run every operation inside the factory at the level of detail those operations need. It knows 500 units should be made this week. It doesn't need to know which batch of resin went into machine 7 or why the line stopped for 11 minutes. That second-by-second detail, captured at the point of work, is what MES/MOM and other specialist applications add."
    - q: "Do manufacturing-focused ERPs still need MES/MOM?"
      a: "Some ERPs were designed with manufacturing in mind and cover more of the production side, such as detailed routings and shopfloor reporting. That makes the gap to MES/MOM smaller, which is helpful. MES/MOM still adds a different layer of data: finer detail, captured in real time, with every event tied to its order, batch, machine and operator."

mes-simplifies-erp:
  summary: "ERP is built to run the business, not the shopfloor. Forcing it to handle real-time execution adds custom code and complexity. Putting execution into MES/MOM alongside ERP lets both run closer to standard and improves ERP data, because MES/MOM posts actual consumption and output rather than backflushed estimates."
  faq:
    - q: "Does MES replace ERP?"
      a: "No. ERP keeps running the business, including finance, purchasing, planning and inventory valuation. MES/MOM runs the shopfloor and keeps ERP up to date with what actually happened. Each does the job it was designed for."
    - q: "How does MES improve ERP data?"
      a: "MES/MOM records consumption and output as they happen and posts the actuals to ERP, instead of ERP backflushing standard quantities. That makes inventory and product costs more accurate, and means production is confirmed in near real time rather than at the end of a shift."
    - q: "Does ERP lose visibility when MES is introduced?"
      a: "No. ERP keeps at least the information it had before, because MES/MOM keeps it updated, often with aggregated data. The detailed, high-volume shopfloor data stays in MES/MOM, which also reduces the transaction load on ERP."

isa-95-explained:
  summary: "ISA-95 (IEC 62264) is the international standard for integrating business systems with manufacturing operations. It defines five levels, from the physical process at level 0 to ERP at level 4, with MES/MOM at level 3. It also defines what ERP and MES/MOM exchange, and the four areas of manufacturing operations: production, quality, inventory and maintenance."
  faq:
    - q: "What are the levels of ISA-95?"
      a: "Level 0 is the physical process. Level 1 is sensing and manipulating it, through sensors and actuators. Level 2 is monitoring and control, through systems such as PLCs and SCADA. Level 3 is manufacturing operations management, which is MES/MOM. Level 4 is business planning and logistics, which is ERP."
    - q: "Where does MES fit in ISA-95?"
      a: "MES/MOM sits at level 3, between ERP above and the control layer below. It receives orders and master data from ERP and manages execution on the shopfloor. A summary of actual production and consumption then goes back to ERP."
    - q: "Is ISA-95 still relevant?"
      a: "Yes. It gives IT and operations people a shared language, and a predictable framework for what passes between ERP and MES/MOM. Newer architectures such as IIoT and the unified namespace sit in the connectivity layer and work alongside it rather than replacing level 3."

what-is-oee:
  summary: "OEE, overall equipment effectiveness, compares the good product a line made with what it could have made in its planned time. It's calculated as availability multiplied by performance multiplied by quality. Measure it at the bottleneck, capture the data automatically so short stops are counted, and use the components to see where the losses are."
  faq:
    - q: "How do you calculate OEE?"
      a: "Multiply availability by performance by quality. Availability is run time divided by planned time. Performance is the quantity produced divided by what the line could have made at its target speed. Quality is good quantity divided by total quantity. Together they simplify to good quantity divided by what the planned time allows at the target cycle time."
    - q: "What is a good OEE score?"
      a: "An OEE of 85% is often quoted as world class, a figure that comes from the total productive maintenance tradition. Many manufacturers run well below that, and a realistic target depends on your industry and starting point. An honest figure from automatic data capture is more useful than a higher manual one."
    - q: "Why does OEE drop when data capture is automated?"
      a: "Manual recording misses short stops of a few seconds and rounds the length of longer ones, so manual OEE is usually higher than reality. Automatic capture from the equipment counts every stop. Explain the change before it happens, so the lower figure is treated as a more accurate baseline rather than a failure."

mesa-and-the-definition-of-mes:
  summary: "MESA International, best known for its MESA-11 model of MES functionality, ceased operation on 30 June 2026, and ISA took on its educational programmes and content the same day. The MESA-11 model set out eleven functions, far broader than production execution, and later models connected MES to the wider business. Members can transfer to ISA free until the end of 2026."
  faq:
    - q: "What is the MESA-11 model?"
      a: "Published by MESA in 1997, it set out eleven core functions of MES, including detailed sequencing, dispatching, genealogy, labour, quality, document control, performance analysis, maintenance and data collection. It was a functional map of what a factory needs managed, not a specification for a single product."
    - q: "What happened to MESA International?"
      a: "MESA ceased operation on 30 June 2026. The International Society of Automation took on its educational programmes and content the same day, and MESA members can transfer to ISA at no cost until the end of 2026."
    - q: "How did MESA define MES?"
      a: "MESA described MES as a dynamic information system that drives effective execution of manufacturing operations. Its models grew over time, from the eleven functions of 1997 to later models showing how production operations connect with business operations and strategy."

who-benefits-from-mes:
  summary: "Almost everyone in manufacturing operations benefits from MES/MOM, in different ways. Operators get guidance and less paperwork, specialists get data to plan and improve, managers get live performance and escalations, and executives get trusted figures for cost and delivery. The breadth of benefit depends on how much of the operation the product covers."
  faq:
    - q: "Who uses an MES?"
      a: "Operators, logistics staff, maintenance technicians and toolroom staff use it to do and record their work. Schedulers, quality engineers, continuous improvement engineers and maintenance engineers use its data to plan and improve. Managers use it to monitor performance, and executives usually see its data through reports or other systems."
    - q: "How does MES help operators?"
      a: "It guides them through the work with current instructions, and captures counts and downtime from the machine so they don't have to write them down. Error-proofing and alerts help them get it right first time."
    - q: "Do executives use MES directly?"
      a: "Rarely. Executives usually see MES/MOM data through reports, ERP or a data platform it feeds. They should still be involved in the buying decision, because the business case rests on cost and delivery improvements they care about."

history-of-mes:
  summary: "Manufacturing systems moved from paper and skill, through PLCs in 1969 and SCADA, to ERP for the business and separate departmental systems on the shopfloor. MES emerged in the early 1990s to bring execution together, and ISA-95 in 2000 standardised the model, leading to broader MOM platforms. AI is the next step, and it depends on the same data foundation."
  faq:
    - q: "When did MES start?"
      a: "The term MES emerged in the early 1990s, to describe systems that managed execution on the shopfloor between ERP and the control layer. MESA International was founded in 1992 and published its eleven-function MES model in 1997, and ISA-95 Part 1 followed in 2000."
    - q: "What came before MES?"
      a: "Paper records and control systems such as PLCs, alongside separate departmental systems for quality and maintenance. Each solved one department's problem, but few shared data. MES/MOM brought that operational data together with its context."
    - q: "What comes after MES?"
      a: "MES/MOM keeps growing in scope, connecting to IIoT devices and data platforms and building AI into everyday tools. AI that predicts and optimises operations still depends on reliable, contextualised shopfloor data, so the data foundation remains the first step."

introduction-to-mes-and-smart-manufacturing:
  summary: "Smart manufacturing gets the headlines, but MES is the platform underneath it. ERP manages the business; MES coordinates, tracks and records everything that happens in the factory, across production, quality, inventory and maintenance. It connects ERP and enterprise applications to the machines, and gives decision-makers real-time data they can trust."

mes-market-overview:
  summary: "The MES/MOM market is growing at around 10% a year, and many smaller manufacturers still run on paper or spreadsheets. Demand is driven by workforce change, AI ambitions, traceability and composable ERP. Legacy toolkits are giving way to two modern approaches: platforms for builders, and configurable enterprise platforms. Buyers should know which type they're choosing, and why."
  faq:
    - q: "How big is the MES market?"
      a: "Estimates vary with what is counted. MarketsandMarkets puts MES software and services at around $16 billion in 2025, growing to almost $26 billion by 2030. Software-only estimates are lower, such as IoT Analytics at $5.5 billion in 2024."
    - q: "What types of MES vendor are there?"
      a: "Broadly, legacy toolkit applications that are heavily customised, platforms that let manufacturers build their own applications, and configurable enterprise platforms designed for standardisation across many sites. Builder platforms and enterprise platforms tend to serve different kinds of business rather than compete directly."
    - q: "What trends are shaping the MES market?"
      a: "Scope is broadening from MES to MOM, connected worker is increasingly built in, licensing is moving to subscription alongside cloud delivery, and AI features are appearing in products. Buyers also increasingly expect configuration and low-code rather than heavy customisation."

mes-functionality-guide:
  summary: "MES/MOM covers far more than production. Its core functions are production, quality, inventory and maintenance, on one set of data, and the broadest platforms add capabilities such as tooling and connected worker. Each function depends on the others, so when they share one platform the context is captured automatically. This guide links to a detailed article on each function."
  faq:
    - q: "What are the main functions of an MES?"
      a: "Production monitoring and scheduling are the core of MES. MOM extends that across the whole operation, which ISA-95 splits into production, quality, inventory and maintenance. Many platforms also cover tooling and energy."
    - q: "Is MES just production monitoring?"
      a: "No. Production monitoring is the production pillar, and often the first step. Operators also perform quality checks and look after their equipment. A full MOM supports all of that on the same data, so a quality check knows which order is running."
    - q: "Why does it matter if MES functions share one platform?"
      a: "Because the functions depend on each other. Downtime matters to production and maintenance alike, and a material lot carries its inspection results. On one platform that context is captured automatically; across separate systems some of it is lost at each interface."

mes-functionality-production:
  summary: "Production monitoring is the most fundamental MES function. MES/MOM runs production orders on the line and records counts, scrap, rework, downtime and labour against each one, ideally straight from the machine. That data feeds OEE and continuous improvement. A good system also prevents mistakes as they happen, rather than only recording them afterwards."
  faq:
    - q: "What does MES production monitoring record?"
      a: "It records output against each production order as it happens: good counts, scrap and rework with reasons, downtime with reasons, and the labour spent. Everything is tied to the order, so it can be analysed by product, machine, shift or operator, and summarised for ERP."
    - q: "Why does OEE often drop when MES is introduced?"
      a: "Because the figures become accurate. Manual recording misses short stops of a few seconds or minutes, and rounds the rest. Capturing downtime automatically from the machine reveals losses that were always there, which is the starting point for improving them."
    - q: "Should production data be collected automatically or manually?"
      a: "Automatically wherever the equipment allows it, usually through OPC UA or MQTT. It's real time and more accurate than manual entry. Manual entry still has a place for older machines, and for information only a person can give, such as the reason behind a stop."

mes-functionality-scheduling:
  summary: "ERP creates production orders from demand and stock levels. MES/MOM receives them with their routings and bills of materials, lets schedulers fine-tune the sequence and the equipment, and releases orders to the shopfloor, where operators see a live plan. A dedicated APS is worth adding when sequencing itself becomes the hard problem."
  faq:
    - q: "Does MES do production scheduling?"
      a: "Most MES/MOM platforms let schedulers adjust the sequence of the orders ERP has created and release them to the line. How sophisticated that is varies widely between products, from a simple dispatch list to detailed short-interval scheduling."
    - q: "What is the difference between ERP and MES scheduling?"
      a: "ERP plans in weeks and months, usually with simplified capacity, and decides what to make and when. MES/MOM works in shifts and minutes, sequencing and dispatching orders against real equipment and feeding back what actually happened."
    - q: "When do you need an APS as well as MES?"
      a: "When sequencing becomes genuinely complex: shared bottlenecks, sequence-dependent changeovers, tools shared across machines or large numbers of orders changing every day. For stable production with simple changeovers, ERP plus MES/MOM is often enough."

mes-functionality-quality:
  summary: "MES/MOM runs quality at the point of production. It manages control plans, prompts the right inspection when it's due, captures variables and defects, often straight from gauges, applies SPC and places holds on suspect material. Every result is tied to the order and the lot, which makes traceability and root cause analysis much faster."
  faq:
    - q: "What quality functions does an MES include?"
      a: "Typically quality control plans, inspections triggered by what's running, variable and defect recording, SPC, connections to gauges and inspection equipment, holds and non-conformances. Some platforms also manage documents and corrective actions, while others pass those to a QMS."
    - q: "Can MES replace a QMS?"
      a: "A good MOM platform can. Beyond in-process checks, it covers the wider quality system, including CAPA, audits, complaints and controlled documents, so a separate QMS isn't needed. MES on its own, focused on production, usually covers only in-process quality."
    - q: "What is the difference between out of specification and out of control?"
      a: "Out of specification means a result falls outside the specification limits, so the product doesn't meet requirements. Out of control means a result falls outside the statistical control limits, a sign the process is drifting even if parts are still within specification."

mes-functionality-inventory:
  summary: "MES/MOM manages inventory once it reaches production: lots, serials, containers and handling units at each line-side location. It validates every item at the point of use against the order and its bill of materials, and records consumption at lot or serial level. ERP keeps the totals and the value; the shopfloor system keeps the detail."
  faq:
    - q: "Should inventory on the shopfloor be managed in ERP or MES?"
      a: "ERP should usually own inventory at an aggregated level, by material and warehouse, valued for the balance sheet. The shopfloor needs individual lots, exact locations, quality status and consumption by order, captured in real time. That detail usually sits best in MES/MOM, which keeps ERP updated with the totals."
    - q: "What is the difference between backflushing and recording actual consumption?"
      a: "Backflushing assumes the bill of materials quantity was used, so nothing is recorded on the shopfloor and scrap or substitutions disappear. Recording actual consumption captures the lot or serial used and the real quantity, which keeps stock accurate and gives traceability."
    - q: "Why print labels at the point of production?"
      a: "Pre-printed labels lead to mislabelling and manual corrections. When MES/MOM prints the label as inventory is made, it already knows the order, material, lot and quantity, so the label is correct from the start."

mes-functionality-logistics:
  summary: "Factory logistics covers receiving goods, replenishing the line, putting finished goods away, warehouse moves and shipping. It can run in ERP, a dedicated WMS or MES/MOM. ERP suits simple warehouses, a WMS suits complex or automated ones, and MES/MOM suits flows driven by production. Many manufacturers combine them, with MES/MOM running from the supermarket to the line."
  faq:
    - q: "Should warehouse management sit in ERP, a WMS or MES?"
      a: "It depends on the warehouse. ERP often suits a simple warehouse with straightforward picking. A WMS earns its place with high volumes or automation. MES/MOM suits flows driven by production, such as supermarkets and kanban, but isn't designed for a large distribution warehouse."
    - q: "What is automated replenishment to the line?"
      a: "The system tracks stock at each line-side location and raises requests by rule, for example when stock falls below a reorder point, or ahead of upcoming orders on the schedule. It keeps lines supplied without piling stock beside them."
    - q: "Why relabel material at goods-in?"
      a: "Suppliers sometimes deliver several packs under one lot code with no unique identifier. Giving each pack its own factory label and material number makes it individually traceable, and simpler to move and consume in production."

mes-functionality-maintenance:
  summary: "Maintenance belongs in the same platform as production because both teams care about the same downtime. In MES/MOM, operators raise faults from the screen they already use and see the planned work and autonomous maintenance tasks for their equipment. MOM maintenance replaces the need for a separate CMMS, while an EAM still makes sense for asset-heavy operations with advanced needs."

mes-functionality-tooling:
  summary: "Moulds, dies, jigs and fixtures are often the biggest single factor in quality, yet many factories manage them on a whiteboard. MES/MOM counts tool life from real production, tracks cavities and readiness, triggers maintenance by usage and records which tool made each part. Changeovers become planned activities instead of scrambles."

mes-functionality-energy:
  summary: "Most factories can't see energy below the site meter. MES/MOM links consumption to the machine and the order that caused it, including idle running, so you can measure energy per piece and find waste. Start with your biggest consumers and bottleneck lines. In my experience the first improvements usually pay for the metering."

kaizen-and-mes:
  summary: "Kaizen is continuous improvement through small, regular changes made by everyone, with a stable standard to measure against. MES/MOM supports it by capturing losses automatically, and by showing whether an improvement has held. It won't create a Kaizen culture on its own, but it removes much of the data collection that slows improvement teams down."
  faq:
    - q: "What is Kaizen in manufacturing?"
      a: "Kaizen is a Japanese word meaning change for the better. In manufacturing it describes continuous improvement through many small, low-cost changes made by people at every level, built on a standard way of working and the plan, do, check, act cycle. It's a core part of the Toyota Production System."
    - q: "How does MES support Kaizen?"
      a: "MES/MOM records downtime, cycle times and quality results automatically, so improvement teams can find the biggest losses without weeks of manual study. It provides a baseline for each change, and shows whether gains have held over time."
    - q: "What is a digital morning meeting?"
      a: "It's a daily performance meeting run from live shopfloor data rather than reports prepared by hand. Everyone sees the same figures for yesterday's performance, actions are logged against the data that prompted them, and next week's meeting shows whether they worked."

food-and-beverage-manufacturing-challenges:
  summary: "Food and beverage manufacturers face strict food safety demands, waste and give-away, variable yields, labour shortages and fragile supply chains. MES/MOM helps by monitoring critical parameters, enforcing recipes and procedures digitally, tracking give-away in real time and recording every ingredient lot, so traces take minutes and recalls stay narrow."
  faq:
    - q: "What are the biggest challenges in food and beverage manufacturing?"
      a: "Food safety and quality come first, followed by cost and waste, including spoilage and give-away. Yield and skills shortages are also major pressures, and end-to-end traceability underpins a resilient supply chain."
    - q: "What is give-away in food manufacturing?"
      a: "Give-away is product packed above the declared weight to make sure packs aren't underweight. Small amounts per pack add up across millions of units. MES/MOM can measure give-away by line and product in real time, so it can be controlled rather than estimated."
    - q: "How does MES help food and beverage traceability?"
      a: "MES/MOM records every ingredient lot and process step against each batch as production happens. That allows forward and backward traces in minutes, and narrows recalls to the batches that actually used an affected lot."

food-manufacturing-mes-barriers:
  summary: "Food MES projects rarely fail because of the technology. The barriers I see most are people and change management, starting too big, underestimating master data such as recipes and specifications, and choosing a platform that can't grow. Involve operators early and start on one line, with the data foundation right first."

mes-implementation-team:
  summary: "MES/MOM projects succeed or fail on people more than software. You need an executive sponsor who removes barriers, a capable project manager, IT and operations involved from the start, and operators shaping the design. Add external expertise where internal experience is thin, and plan for change from day one."
  faq:
    - q: "Who should be on an MES implementation team?"
      a: "An executive sponsor, a dedicated project manager, IT, and representatives from production, quality, logistics and maintenance. Operators and other experienced shopfloor people should be involved in design and testing. Most teams also include the vendor or a systems integrator, and sometimes an independent consultant."
    - q: "What makes a good MES project manager?"
      a: "Knowledge of MES/MOM and your production processes, strong communication, planning discipline and the ability to solve problems before they cause delays. They are the main point of contact between the internal team and external partners, and often lead the roll-out to further sites."
    - q: "Why do MES projects fail?"
      a: "Common reasons include weak executive sponsorship, part-time teams, unclear objectives, poor master data and too little attention to change management. Successful projects agree KPIs and fix data early, and treat MES/MOM as a business change rather than a software installation."

mes-roi-bottom-line:
  summary: "MES/MOM improves the bottom line mainly through less downtime, less scrap and rework, less admin time, lower inventory, smaller recalls, better ERP costing and lower energy use. Start by asking what 1% of OEE is worth on your bottleneck, measure your own losses, count costs honestly and phase the investment so early results fund the next stage."
  faq:
    - q: "What is the ROI of MES?"
      a: "It depends on your losses today. The biggest returns usually come from extra output on bottleneck equipment, and from less scrap and rework. In Deloitte's 2025 Smart Manufacturing Survey, large manufacturers reported average output improvements of 10% to 20% from smart manufacturing initiatives."
    - q: "How do you calculate the value of MES?"
      a: "Quantify what downtime, scrap, overtime, late deliveries and excess inventory cost you today. Estimate realistic improvements from your own data, not vendor claims. Then count the full costs, including your own people's time, and compare them over several years."
    - q: "What is 1% of OEE worth?"
      a: "On a bottleneck, one point of OEE is extra output from equipment you already own, which can mean more sales or a capital project you no longer need. The 1% calculator on this site works it out from a few numbers about your line."

agentic-ai-mcp-manufacturing:
  summary: "Agentic AI is given an objective and acts towards it, often by using other software. MCP (Model Context Protocol) is an open standard for connecting agents to applications and data. On the shopfloor, start with agents that gather information and recommend, with a person making the call, before letting them act within tight limits."
  faq:
    - q: "What is the difference between an AI copilot and an AI agent?"
      a: "A copilot helps a person when they ask, answering a question or drafting something, and the person decides what to do. An agent is given a goal, plans the steps and acts through business systems to complete the task, with a person approving or within agreed limits."

ai-for-frontline-workers:
  summary: "AI for the frontline should give every operator your best operator's knowledge, not replace people. Copilots, shift summaries, real-time coaching and visual inspection support all work today. They're only useful when the AI has MES/MOM context: the order, material, recent stops, approved procedures and who's asking."

ai-ml-genai-on-the-shopfloor:
  summary: "AI is the broad category. Machine learning predicts outcomes from your historical data, and has been in factories for years through SPC and predictive maintenance. Generative AI creates content such as text and code, and helps people more than machines. Each needs different data, so ask which kind before you spend money."

aps-vs-mes-scheduling:
  summary: "ERP plans in weeks and months, usually assuming infinite capacity. APS sequences in days and hours against finite capacity, changeovers and constraints. MES/MOM takes the scheduled orders, dispatches them to the line, can do some basic scheduling, and records what actually happened. Many factories manage without APS; it helps most where sequencing is genuinely complex."
  faq:
    - q: "What is the difference between APS and ERP scheduling?"
      a: "ERP schedules in weeks and days, usually assuming infinite capacity, and works out what to make and when. APS sequences orders in days and hours against finite capacity, taking account of changeovers, tooling, labour and material. Many ERP suites include APS as a module."
    - q: "When is ERP scheduling enough?"
      a: "More often than people expect. With a handful of lines, stable products and simple changeovers, ERP scheduling plus a dispatch list in MES/MOM can cover most needs. APS helps most where sequencing is genuinely complex, such as sequence-dependent changeovers or shared tools."
    - q: "Does MES do scheduling?"
      a: "MES/MOM mainly takes the scheduled orders and dispatches them to the line, and some platforms add basic short-interval scheduling for the next shift or day. Its biggest contribution is feeding actual cycle times and downtime back, so the next plan is built on reality."

cloud-vs-on-premises-mes:
  summary: "On-premises MES/MOM runs on servers you manage; cloud MES/MOM runs on a platform the vendor manages, usually with an edge component at each site. Most multi-site on-premises MES already runs in a central data centre that sites reach over the network. Cloud adds large-scale security, easier scaling and continuous updates. On-premises fits sites without reliable connectivity."
  faq:
    - q: "Can MES run in the cloud?"
      a: "Yes, and many vendors now deliver MES/MOM as SaaS. Critical shopfloor functions and machine connectivity typically run on an edge component at each site, which buffers data and keeps production moving if the connection drops. The wider application, reporting and analytics run in the cloud."
    - q: "Is cloud MES secure?"
      a: "Major cloud platforms invest in security at a scale few manufacturers can match, with continuous monitoring, rapid patching and certifications such as ISO 27001 and SOC 2. Ask any vendor which certifications they hold, how often they patch and which regions your data can be held in."
    - q: "When does on-premises MES still make sense?"
      a: "Mainly where a site has no reliable connectivity, or in air-gapped environments such as defence and some critical infrastructure. Some regulated sites also value full control over when changes happen."

configure-dont-customise:
  summary: "Out of the box, configuration, low-code, integrations, extensions and customisation are six different things. Only true customisation changes the product, and it costs you again at every upgrade. Your manufacturing processes are probably less unique than they feel, so pick a mature, configurable platform and challenge every gap."

connected-worker-one-app-not-five:
  summary: "Connected worker tools digitise frontline work: checklists, shift handover, skills, work instructions and safety sign-offs. MES/MOM runs production and quality. Connected worker can be bought as a standalone app, which is quick to start but lacks production context, or built into MES/MOM on the same data. My preference is built in."
  faq:
    - q: "What is a connected worker platform?"
      a: "Connected worker is the digital layer between frontline people and everything they need to do their job. In practice that's digital checklists and tasks, structured shift handover, skills and certification tracking, always-current documents and work instructions, and health and safety sign-offs."
    - q: "Should connected worker be separate from MES?"
      a: "Both approaches are used. A standalone app is quick to start, but doesn't know which order is running unless it's integrated. Built into MES/MOM, checklists and skills can react to what's actually happening and block actions. My preference is built in, so operators work in one application."
    - q: "Why is connected worker growing so fast?"
      a: "The workforce problem. Experienced people are retiring with knowledge that lives in their heads, and the people replacing them tend to stay for shorter periods. Shopfloor software now has to guide a new starter to get it right on their second day, not their second year."

contextualised-manufacturing-data:
  summary: "A machine signal that says \"stopped\" tells you very little. Context adds the order, product, shift, duration and reason, and that's what turns data into decisions and eventually AI. MES/MOM is where most of that context comes from, which is why point solutions that each see one slice lose so much of the value."

cpq-to-shopfloor:
  summary: "CPQ produces a valid, priced configuration. ERP usually turns it into an order-specific BOM and routing, and MES/MOM receives a normal production order. Engineer-to-order adds PLM to the flow, plus partial release and one-off drawings, which is where a direct PLM to MES/MOM link for documents can help."

digital-shift-handover:
  summary: "Most shift handovers are a quick chat at the door, so detail gets lost. Build the handover from what actually happened, using MES/MOM data on orders, stops, quality and maintenance, then let the supervisor add what only a person knows. Give it a fixed structure with sign-off from both supervisors, and carry open actions forward until they're closed."

digital-work-instructions:
  summary: "A PDF on a tablet is paper on a screen. Proper digital work instructions appear automatically for the job that's running, are always the latest version, run step by step and capture confirmations as you go. Inside MES/MOM they can react to what's happening, which is how new starters get it right in days rather than months."

discrete-vs-process-manufacturing:
  summary: "Discrete manufacturing makes countable items that could in theory be taken apart, and includes repetitive, job shop and assembly. Process manufacturing transforms materials that can't be separated again, in batches or continuously. Mixed-mode combines the two, for example a batch that's then filled and packed. The type shapes units of measure, traceability, KPIs and which MES/MOM fits."
  faq:
    - q: "What is the difference between discrete and process manufacturing?"
      a: "Discrete manufacturing makes countable items that could in theory be taken apart, such as cars or electronics. Process manufacturing transforms materials that can't be separated again, such as food or pharmaceuticals, measured by weight or volume and made to recipes."
    - q: "What are the main types of manufacturing?"
      a: "Discrete splits into repetitive, job shop and assembly. Process splits into batch and continuous. Mixed-mode combines them, such as a food plant that mixes a batch and then fills and packs it into cases. Production strategy, from make to stock to engineer to order, is a separate choice."
    - q: "Why does the type of manufacturing matter for MES?"
      a: "It shapes units of measure, how traceability works, which KPIs matter and what operators need on screen. Not every MES handles every type equally well, so ask vendors to show your type running, including any handovers between process and discrete steps."

eam-cmms-and-mes:
  summary: "EAM and CMMS manage assets and maintenance work orders, with ERP usually owning the financial side. MES/MOM knows what the asset is doing right now. They overlap on downtime and usage counters, so run day-to-day maintenance inside MES/MOM, which removes the need for a CMMS, connect an EAM where asset management needs one, and make sure everyone agrees on what stopped and why."

ebom-mbom-as-built:
  label: The short version
  summary: "The engineering BOM lives in PLM, the manufacturing BOM usually lives in ERP, each production order gets its own copy as the order BOM, and MES/MOM records the as-built: exactly which lots and serials were used. Most integration arguments come from not agreeing who owns which stage."

erp-master-data-for-mes:
  summary: "ERP master data is usually set up for costing, and MES/MOM needs more: which machines each operation runs on, realistic cycle and setup times, material by operation, and quality checks by step. Fix it once at the source so every system benefits, and plan for it early rather than discovering the gap halfway through."

esg-needs-shopfloor-data:
  summary: "ESG reporting increasingly needs evidence, and much of it starts on the shopfloor: energy per machine and product, idle consumption, scrap, yield and water. MES/MOM already knows what was made, where and for which order. Add machine-level energy data and sustainability becomes operational efficiency with a reporting benefit."

how-long-does-mes-implementation-take:
  label: The short version
  summary: "For a first site, usually six to eighteen months, and twelve to eighteen was the most common answer when I polled people. I've seen it done in four, with an educated customer, a superb team, a configurable product and a focused scope. Later sites are much faster with a template."
  faq:
    - q: "How long does an MES implementation take?"
      a: "For a first site, most implementations I've seen take between six and eighteen months from kick-off to go-live. When I polled people, twelve to eighteen months was the most common experience. A focused deployment on a few lines can be done in around six months, while a broad programme with complex integration takes longer. Later sites are much faster with a template."
    - q: "What makes MES projects run late?"
      a: "The usual causes are scope creep, master data that turns out not to be detailed enough, under-resourcing because the people you need are already the busiest in the business, customising to match old quirks instead of simplifying, and legacy equipment that's harder to connect than expected. None of them are about the software install itself."
    - q: "Can an MES go live faster than six months?"
      a: "Yes. I've been involved in projects that went live in about four months. The customer knew what they were buying, the team was superb and fully available, the product was highly configurable so almost everything was out of the box, and the first scope was small to medium. Preparation, people and scope made the difference."

how-to-choose-an-mes:
  summary: "Choose MES/MOM for the long term, not just today's problem. Ask every vendor about ERP master data, integration, industry fit, operator experience, training, scope beyond production, AI and IIoT, and growth across sites. Avoid wish-list RFPs: base requirements on your process maps and separate what you need now from later."
  faq:
    - q: "What should I ask an MES vendor?"
      a: "Cover four areas. The technical foundation, including how master data and integration with ERP work. The user experience on tablets and shopfloor terminals, and how much training people need. The functional scope beyond production. Then future-proofing, including AI, IIoT and growth across sites. Ask for a demo built for your type of manufacturing, and put the system in front of one of your operators."
    - q: "What are the most common mistakes in MES selection?"
      a: "Focusing on price, or on a narrow set of today's problems, and writing an RFP that reads like a wish list. If you're asking for everything, you don't know what you want. Base requirements on your process maps, separate what you need now from what you might need later, and judge future needs at the level of platform capability rather than detailed features."
    - q: "How long should an MES last?"
      a: "Choose it as a platform you'll grow with for many years. Get the decision wrong and you can find yourself evaluating again within three to five years, with the added pain of migrating away from a system that didn't fit. That's why breadth across the operation and the vendor's ability to keep investing matter as much as today's feature list."

iiot-vs-mes:
  summary: "IIoT is about connecting machines and sensors so their data can be collected. MES/MOM puts that data to work: orders, traceability, quality checks, maintenance and guiding operators. Collecting machine data is basic for any MES, so you need both, with IIoT feeding MES/MOM rather than trying to replace it."
  faq:
    - q: "What is the difference between IIoT and MES?"
      a: "IIoT is about connecting machines, sensors and devices so their data can be collected, usually through OPC UA and increasingly MQTT. MES/MOM puts that data to work: managing orders, enforcing quality checks, tracing material, raising maintenance work with context and guiding operators. IIoT gives you data points, and MES/MOM gives you operational management."
    - q: "Can an IIoT platform replace an MES?"
      a: "Not if you need MES functionality. Collecting machine data is a basic requirement for any MES, so an IIoT platform covers one small part of it. Manufacturers who start with IIoT alone often discover they still can't manage a production order or trace a lot, and end up building a homegrown MES on top or buying one and integrating."

isa95-integration-patterns:
  summary: "Start every integration by agreeing what object moves, which system owns it, what triggers it and how fresh it must be. ERP is usually the hub: business transactions go through ERP, and execution detail can go direct when speed or richness demands it. Then choose point-to-point, middleware, event-driven or UNS."

lims-and-mes:
  summary: "LIMS runs the lab and MES/MOM runs the batch. MES/MOM should trigger the sample with its batch context attached, and LIMS results should flow straight back so the next step is released or the batch is held. ERP usually holds batch status, and final release can sit in ERP, LIMS, a QMS or MES/MOM."

manufacturing-change-management:
  summary: "Every smart factory project meets resistance, because change is uncomfortable. Leadership has to set the vision, back change management, build a strong team and invest in skills. Involve operators in the design and explain why it makes their shift easier. Adoption deserves as much investment as implementation."

manufacturing-data-platforms:
  summary: "Historians hold high-frequency machine data, warehouses hold structured data for reporting, lakes hold raw data at scale, and data fabric connects data where it already lives. AI usually reads from the data platform, but the context that makes the data valuable is created upstream by MES/MOM at the point of work."

manufacturing-kpis-beyond-oee:
  summary: "OEE matters, but it doesn't tell you everything. Make sure you can also measure first-pass yield, scrap rate, cycle time, changeover time, OTIF, MTBF and MTTR, calculated consistently and ideally to ISO 22400. Every one depends on accurate, granular data captured as it happens, not reconstructed at the end of the shift."

manufacturing-process-mapping:
  summary: "Digitise a broken process and you get a faster broken process. Before buying anything, agree the physical hierarchy, then map what really happens using a swimlane grid of departments against processes, with the people who do the work. Decide which version of a process to standardise before you build it into software."

manufacturing-traceability:
  summary: "Order-level traceability with backflushing in ERP is better than nothing, but nowhere near what's possible. MES/MOM gives you genealogy forwards and backwards, down to serials and exact lot quantities, plus tooling, quality results, context and process parameters. In a recall, that's the difference between minutes and a weekend in spreadsheets."

mes-and-digital-twins:
  summary: "A digital twin is a virtual model kept in sync with the real factory by live data. MES/MOM doesn't do the simulation, but it supplies much of the operational reality: what's running where, material, quality, asset status and people, already in context. Without that, a twin drifts away from the factory it represents."

mes-business-case:
  summary: "Business cases usually stall because of fear of overrun and failure, not the idea itself. Put money on today's pain in quality, downtime, labour, delivery and inventory, and show realistic costs including your internal people. Spend most effort on how risk is managed, through phased delivery and an honest view of the cost of doing nothing."
  faq:
    - q: "How do you build a business case for MES?"
      a: "Speak business, not features. Put a value on today's pain in quality, downtime, labour, delivery and inventory, then connect each number to what the system will change. Show realistic costs and timeline, including your own people's time, not just licences and services. Then spend most of your effort on how the risk will be managed, because fear of failure is usually what's really blocking approval."
    - q: "Why do MES business cases get rejected?"
      a: "In my experience it's rarely the idea that's rejected. It's the way it's presented. Leadership hears technical features instead of business impact, or a past project went badly and nobody wants a repeat. Underneath most objections is fear of overrun and failure, so the case has to address that directly, with phased delivery and clear points where leadership can decide whether to continue."
    - q: "What is the cost of doing nothing?"
      a: "It's the risk you carry by staying as you are. Quality escapes, failed audits, experienced operators retiring with the knowledge in their heads, and competitors who are already moving. Framing the investment as risk mitigation, delivered in phases where each one proves value and funds the next, often changes the conversation with leadership completely."

mes-go-live:
  summary: "Go-live is the starting line. Plan hypercare with support on every shift and visible super users, and fix issues fast enough to keep people's trust. Measure what the business case promised against the baseline and celebrate the quick wins. The value comes from improving and extending the system after go-live."

mes-in-regulated-industries:
  summary: "In regulated industries you have to prove you made it correctly, often years later. Pharma relies on electronic batch records and review by exception, and medical devices on complete build records with qualified operators. Aerospace and automotive add serialised traceability, first article inspection and PPAP. Customisation multiplies validation effort."

mes-multi-site-rollout:
  summary: "Build an enterprise template that defines standard processes, master data, KPIs, screens and integrations, then roll it out site by site, allowing local differences only where there's a real reason. A centre of excellence blending IT and OT owns the template, and later sites go live much faster."

opc-ua-mqtt-uns-explained:
  summary: "OPC UA is the standard for reading machines with structure and security built in. MQTT is a lightweight publish and subscribe protocol, and the two often work together. A unified namespace organises all operational data in one place. Connectivity moves data; MES/MOM gives it meaning and publishes the context others need."

ot-cybersecurity-for-mes:
  summary: "MES/MOM sits between IT and OT, so it's both a bridge and a security boundary. OT puts availability and safety first. Use IEC 62443 zones and conduits with an industrial DMZ, never connect the enterprise network straight to a PLC, control remote vendor access, and plan for recovery. Get a specialist involved."

paperless-manufacturing:
  summary: "Removing paper is a great first step if you can't do everything at once. Start with the paper that hurts most, often quality check sheets or downtime logs, one line at a time. Avoid a different cheap tool for every form: choose a platform that can grow into full MES/MOM."

plm-erp-mes-digital-thread:
  summary: "PLM owns what a product is, ERP owns the business of making it, and MES/MOM owns execution. In most manufacturers product data reaches the shopfloor through ERP, which is a sound design. A direct PLM to MES/MOM link makes sense for rich content that ERP isn't built to carry, such as 3D models and illustrated instructions."

practical-genai-for-the-shopfloor:
  summary: "GenAI already saves time in factories in four ways: answering questions about operational data in plain English, helping configure systems, acting as a knowledge assistant on every screen, and drafting shift summaries. Every one depends on the AI having access to good, contextualised data from your shopfloor systems."

predictive-maintenance-data:
  summary: "Predictive maintenance is the last step after reactive, preventive and condition-based maintenance. Start by recording downtime accurately and automatically. Models then need condition data, failure history, maintenance actions and operating context, and the operating context usually lives in MES/MOM. Begin with your bottleneck assets."

qms-and-mes-quality:
  summary: "An enterprise QMS runs CAPA, complaints, audits and supplier quality, while MES/MOM runs quality at the point of production. The loop breaks when shopfloor defects never reach the CAPA process with their context. Use rules to escalate the right non-conformances into the QMS, and send process changes back to the line."

replacing-a-homegrown-mes:
  summary: "The hardest part of replacing a homegrown MES is people. Turn the developers who built it into champions and resist the urge to replicate every quirk. Don't let the 5% the new system does differently overshadow everything it does better, and map what the old system really does before you start."

scada-vs-mes:
  summary: "SCADA controls and supervises equipment in real time; MES/MOM manages the operation. If SCADA is mainly there for visibility, MES/MOM can often cover it and leave you with fewer systems to run. In heavier process industries with real control loops, keep both and agree a clear boundary between them."
  faq:
    - q: "Do I need both SCADA and MES?"
      a: "Maybe, but not always. If SCADA is mainly used for visibility rather than tight process control, as in many discrete and lighter process plants, MES/MOM can often cover what operators need with production context added. In heavier process industries with continuous control or safety-critical loops, SCADA stays, and you need a clear boundary between the two."
    - q: "What is the difference between SCADA and MES?"
      a: "SCADA is for real-time control and monitoring of equipment, used by process engineers and control room operators to adjust setpoints and respond to alarms. MES/MOM manages the operation: which order is running, what's been produced and scrapped and why, whether quality checks were done, which material was used and what maintenance is due."

service-data-back-to-engineering:
  summary: "When products fail in the field, the answer is often in the as-built record. Service records the failure against the serial number, ERP links it to the installed base and warranty, and MES/MOM shows what the failed units had in common. The fix then goes to whoever owns the cause, whether that's engineering in PLM or the shopfloor."

skills-enforcement-shopfloor:
  summary: "A skills matrix in a spreadsheet records qualifications; it doesn't stop the wrong person running the wrong job. Define skills against specific operations and equipment, and let expiry dates and procedure changes trigger retraining. Then check qualifications at login and order start, so the system blocks the job rather than reporting it afterwards."

smart-factory-glossary:
  summary: "Plain-English definitions of the terms you'll hear in smart factory projects, from APS and CAPA to SPC and UNS. Each entry explains what the term means in practice and links to the article that covers it in more depth. Bookmark it for the next time a term comes up that you want to pin down."

smart-factory-roi-research:
  summary: "Deloitte's 2025 survey of large US manufacturers reported average gains of 10% to 20% in production output and 10% to 15% in capacity from smart manufacturing. Meanwhile over half of small and mid-sized manufacturers still rely on manual methods. What the main studies actually show, and what they don't tell you."

smart-factory-tech-stack:
  summary: "A smart factory runs on several systems working together. ERP and PLM sit at the enterprise layer, with APS where scheduling needs it. MES/MOM runs operations, with a WMS, EAM or LIMS alongside where needed, and connectivity and data platforms sit beneath and around. Knowing each one's job stops you over-buying or stretching a system too far."

smart-factory-technology-mistakes:
  label: The short version
  summary: "Don't wire ERP straight to machines, build your own MES platform, buy point solutions that can't scale, over-customise, add a lightweight connected worker app that collides with MES/MOM, or mistake an IIoT platform for an MES. I've seen every one of these repeatedly, and every one is avoidable."

time-to-truth:
  summary: "Time to truth is how long it takes a factory to know what really happened, with enough context to act on it. The seven stages run from eventually (paper and Excel) and the end of the hour or shift (ERP on the shopfloor) through after the fact (digitalised point solutions), right now (automatic data capture with MES/MOM) and before it happens (harmonious systems) to before anyone asks (agentic AI with a human in the loop) and without asking (autonomous, within agreed limits). The truth arrives in order."
  faq:
    - q: "What is time to truth in manufacturing?"
      a: "Time to truth is how long it takes your factory to know what really happened, such as a line stopping, with enough context to act on it. A plant on paper and Excel finds out eventually, whenever someone types it up. With automatic data capture through MES/MOM it knows within minutes, with the order and reason attached. A plant with harmonious, connected systems sees the problem coming before it happens."
    - q: "What are the seven stages of time to truth?"
      a: "Eventually, with paper and Excel. End of the hour or shift, with production booked into ERP on the shopfloor. After the fact, with tablets and point solutions that are still keyed in by hand. Right now, with automatic data capture through MES/MOM. Before it happens, with harmonious systems working as one architecture. Before anyone asks, with AI agents preparing decisions for a person to approve. And without asking, with agents making routine decisions on their own inside agreed limits."
    - q: "Can you get value from AI before the data foundation is in place?"
      a: "A little. AI adds value at every stage, but it grows sharply as the data improves. With paper and Excel it's negligible: an AI assistant can tidy and chart a spreadsheet, but it can't analyse what was never captured. AI on ERP data can forecast and spot trends, though it rarely explains why. AI that learns from your own operations, such as anomaly detection, root cause analysis, predictive quality and predictive maintenance, needs data captured automatically and with its context first, and that's where most of the value is."

smart-manufacturing-myths:
  summary: "AI won't solve everything without a data foundation. Excel isn't good enough to run operations. A smart factory is more than MES/MOM, ERP and MES do different jobs, and IIoT doesn't replace MES. These and three more myths come up every week, and each one falls apart once you look at how a factory actually runs."

spc-on-the-shopfloor:
  summary: "Inspection tells you a part is bad; SPC tells you it's about to be. Control limits come from your process and specification limits from the customer, so a process can drift out of control while still in spec. Put control charts and a few well-chosen rules in front of operators, at the line, in MES/MOM."

what-is-a-smart-factory:
  summary: "A smart factory is a manufacturing environment where people, processes and technology work together, supported by data, to maximise efficiency, flexibility and quality. No version number required. In practice that means defined processes, planning connected to execution, real-time data at the point of work, one source of truth for decisions, and people backed to make the call."
  faq:
    - q: "What is a smart factory?"
      a: "My definition is a manufacturing environment where people, processes and technology work together, supported by data, to maximise efficiency, flexibility and quality. The right information reaches the right person at the right time, and decisions are based on facts rather than gut feel. It doesn't need a version number like Industry 4.0 to describe its value."
    - q: "Is a smart factory the same as Industry 4.0?"
      a: "They overlap, but I'd rather describe what something does than give it a version number. Industry 4.0 is a label for a wave of technology. A smart factory is defined by outcomes: defined processes, planning connected to execution, real-time data at the point of work, one source of truth and people backed to make the call. You can have the technology without those."
    - q: "Where does MES fit in a smart factory?"
      a: "MES/MOM is the operational backbone. It connects the business systems to the machines, runs the defined processes on the shopfloor and creates the contextualised data that analytics and AI depend on. A smart factory is broader than MES/MOM, but without it most of the other technology has no reliable operational data to work with."

wms-vs-mes-inventory:
  summary: "ERP owns inventory as a business asset and WMS owns it inside the warehouse. MES/MOM owns it on the shopfloor, including line-side stock and work in progress. Many manufacturers don't need a WMS at all. The boundary that matters is the line, so agree who requests, delivers, receives and records consumption."
  faq:
    - q: "What is the difference between a WMS and MES?"
      a: "A WMS manages the warehouse: receiving, putaway, storage, picking and shipping. MES/MOM manages material once it reaches production: line-side stock and work in progress, with consumption recorded by order and lot. ERP stays the financial owner of the stock."
    - q: "Do I need a WMS if I have MES?"
      a: "Not always. Many plants with simple warehousing manage with ERP inventory plus MES/MOM at the line. A WMS earns its place with high volumes, complex storage, automation or demanding picking, where warehouse execution needs its own system."
    - q: "Where should the boundary between WMS and MES sit?"
      a: "Usually at the line. The WMS owns stock until it's delivered to a line-side location, and MES/MOM owns it from there until it's consumed or produced. Whatever the split, one system should own each location, and quality status must travel with the material."

ai-needs-shopfloor-data:
  summary: "AI that predicts and optimises a factory learns from that factory's data, so it needs a foundation first: defined processes, MES/MOM on the shopfloor, connected equipment and contextualised data built up over time. Generative AI is different. It can start now on documents and know-how, alongside the foundation work, as long as answers are grounded and reviewed."
  faq:
    - q: "Why does AI need good shopfloor data?"
      a: "Machine learning finds patterns in data to predict outcomes, so its predictions are only as good as the data it learns from. Manual or uncontextualised data produces confident-looking but unreliable results. Granular, contextualised data captured automatically is what makes operational AI work."
    - q: "Can generative AI help before the data foundation is ready?"
      a: "Yes. Large language models arrive already trained and work well on SOPs, manuals, maintenance notes and shift logs. They can answer questions from documents, and turn free text and paper records into structured data. They can't recover data that was never captured, and answers should be grounded and reviewed."
    - q: "Where should a factory start with AI?"
      a: "With a decision rather than a model. Ask which decision you'd make differently with perfect data, then work back to the data it needs and how much of it is accurate and in context today. That gap is the roadmap, and for most factories the first steps look like MES/MOM."

how-to-modernise-a-factory:
  summary: "Modernise in order. Assess where you really are, map the process, put a number on the problem and build the team. Then fix the master data, choose a platform for the long term and start small with the end in mind. Connect the machines, go live, scale with a template, and add AI once the data foundation is there."
  faq:
    - q: "What is the first step in modernising a factory?"
      a: "An honest assessment of where you are today. Most factories sit between paper-driven and partly integrated, and often earlier than their board presentations suggest. Then map what really happens on the shopfloor before you look at software. Digitise a broken process and you get a faster broken process, so the order of the early steps matters more than the technology you pick."
    - q: "When should a factory invest in AI?"
      a: "Once the data foundation is in place: defined processes, MES/MOM running them, connected machines and contextualised data you trust. Generative AI can help earlier, working on procedures and shift summaries. Predictive and optimising AI learns from your shopfloor data, so it pays back after the earlier steps, not instead of them."
    - q: "Should you modernise one line or the whole factory at once?"
      a: "Start with one line or area where you can show value quickly, but choose a platform and design that can grow to the whole operation. Doing everything at once multiplies the risk. Starting small with a tool that can't scale just swaps paper silos for digital ones. Once the first area works, turn it into a template and roll it out."

mes-mom-erp-compared:
  summary: "ERP runs the business, MES runs production on the shopfloor, and MOM runs the whole operation across production, quality, inventory and maintenance. APS, WMS, QMS, LIMS, EAM, PLM and SCADA each add depth in one area. Agree which system owns each piece of data, and add specialists only where the operation genuinely needs them."
  faq:
    - q: "What is the difference between MES, MOM and ERP?"
      a: "ERP runs the business side: finance, orders, purchasing, planning and costing, working in months, weeks and days. MES executes production on the shopfloor in shifts, minutes and seconds. MOM covers the whole operation, adding quality, inventory and maintenance to production on the same data. ERP plans and accounts for production, while MES/MOM runs it and reports actuals back."
    - q: "Which system should own inventory?"
      a: "ERP owns inventory as a financial asset. A WMS, or ERP if you don't have one, owns inventory inside the warehouse. MES/MOM owns line-side stock, work in progress and what each order consumed. The handover at the line is where most problems start, so agree who requests, delivers and records consumption."
    - q: "Do I need a WMS, QMS or APS as well as MES?"
      a: "Not always. A WMS earns its place with high volumes or warehouse automation, a QMS only if your MES doesn't cover the quality system, and APS with genuinely hard sequencing. Many ERP suites include these as modules, so needing the capability doesn't always mean another vendor."

shopfloor-applications-explained:
  summary: "Shopfloor applications cover production execution and OEE, in-process quality and SPC, inventory and traceability, maintenance, tooling, energy, and connected worker tools such as work instructions, handover and skills. AI builds on all of them. Match the application to the problem that hurts most, but solve it on a platform that can grow into the rest."
  faq:
    - q: "What are shopfloor applications?"
      a: "Software used at the point of work, by the people doing the work, in real time. That includes production execution, quality checks and SPC, inventory and traceability, maintenance, tooling, energy, digital work instructions, checklists, shift handover and skills. Together they make up the MES/MOM layer, sitting between ERP and the control systems."
    - q: "Should shopfloor applications be separate products or one platform?"
      a: "You can buy most of them separately, but the problems overlap. Quality needs to know what's running, maintenance needs production's downtime, and operators need one screen rather than several logins. Every boundary is an integration to build and retest, and context gets lost at each one. I'd solve the most painful problem first, on a platform that can grow."

smart-factory-where-to-start:
  summary: "Use the first 30 days to understand where you really are: walk every shift, assess maturity and put numbers on the biggest losses. Use the next 30 to choose the first line, map its process and check its master data. In the last 30, build the business case, secure a sponsor, name the team and land one visible quick win."
  faq:
    - q: "Where should a smart factory programme start?"
      a: "With understanding, not buying. Walk the shopfloor on every shift, assess your maturity honestly and put numbers on the biggest losses. Then pick a first line, map its process and check its master data before you write requirements. Talking to vendors comes after that, once you know what you actually need."
    - q: "How do you choose the first line for a smart factory pilot?"
      a: "Look for a line where losses are measurable and worth fixing, ideally at or near the bottleneck, with a reasonably stable process and a keen supervisor. It helps if the equipment can be connected and the line is representative of others, so what you learn carries over. Avoid lines whose problems are mostly mechanical."
    - q: "What should you avoid in the first 90 days?"
      a: "Buying software before you know your requirements, starting with AI before the data foundation exists, and piloting a point solution you couldn't scale. Above all, don't leave the shopfloor out. People support what they helped create, and the operators know the workarounds that never made it into the procedures."

mes-vs-erp:
  summary: "ERP plans and accounts for production: orders, materials, costs and dates, across the business. MES/MOM runs it on the shopfloor in real time, recording what actually happened by order, lot, machine and operator. They overlap on orders and inventory, but do different jobs for different people, and most manufacturers past the simplest operations need both."
  faq:
    - q: "What is the difference between MES and ERP?"
      a: "ERP runs the business side of a manufacturer: finance, sales orders, purchasing, planning and costing, working in months, weeks and days. MES runs production on the shopfloor in shifts, minutes and seconds, recording what happened by order, lot, machine and operator. ERP creates and costs the production order; MES/MOM executes it and sends the actuals back."
    - q: "Can ERP replace an MES?"
      a: "For a small, simple operation, ERP's shopfloor reporting may be enough, and some ERPs designed for manufacturing cover more than others. It stops being enough when you need real-time machine data, lot-level traceability with quality results attached, in-process checks or guided work instructions. ERP should never be connected straight to the machines."
    - q: "Do I need MES if I already have ERP?"
      a: "Most manufacturers beyond the simplest operations do. ERP knows what should be made and what it cost. MES/MOM knows what's happening right now and whether it's right. ERP data also improves when MES/MOM is in place, because it receives actual consumption and output instead of backflushed estimates."

it-vs-ot:
  summary: "IT manages information and puts confidentiality first; OT controls physical equipment and puts availability and safety first. OT assets last decades and can't be patched on a whim. MES/MOM sits on the boundary at ISA-95 level 3, so it needs both: IT owning the application and security, operations owning the processes and data standards."
  faq:
    - q: "What is the difference between IT and OT?"
      a: "IT is the world of business systems such as ERP, email and the cloud, and its first priority is protecting data. OT is the hardware and software that monitors and controls physical equipment, such as PLCs, SCADA and sensors, and its first priority is keeping processes running safely. OT equipment often stays in service for decades."
    - q: "Is MES IT or OT?"
      a: "Both. MES/MOM sits at level 3 of ISA-95, between ERP above and the control systems below. It talks to business systems and the cloud on one side and to PLCs and SCADA on the other, which makes it a bridge and a security boundary. It works best when IT owns the application and security, and operations owns the processes and master data standards."

opc-ua-vs-mqtt:
  summary: "OPC UA is the standard for reading machines, with structure, meaning and security built in. MQTT is a lightweight publish-subscribe protocol that moves data efficiently through a broker to many consumers. They aren't really competitors: OPC UA is often the first hop at the machine, and MQTT the distribution layer across the plant and up to the cloud."
  faq:
    - q: "Should I use OPC UA or MQTT?"
      a: "Often both. OPC UA is the natural choice for reading structured data from machines and PLCs, many of which support it natively. MQTT is better at distributing data efficiently to many systems through a broker. A common pattern collects data with OPC UA at the machine and publishes it over MQTT across the plant."
    - q: "What is Sparkplug B?"
      a: "Sparkplug B is a specification that sits on top of MQTT. Plain MQTT doesn't define what a message means. Sparkplug B adds a defined payload format and a way to track whether each device is online, so different systems can understand the same messages without custom agreements."

oee-vs-teep:
  summary: "OEE, OOE and TEEP all multiply availability, performance and quality, but measure availability against different time. OEE uses planned production time, OOE uses the hours the factory is open, and TEEP uses every hour in the calendar. Use OEE to improve the line, OOE to challenge planned stops, and TEEP to find hidden capacity before you invest."
  faq:
    - q: "What is the difference between OEE and TEEP?"
      a: "OEE measures how well equipment runs during the time it was planned to run. TEEP measures how productive it is against all calendar time, 24 hours a day, 7 days a week. A line running two shifts on weekdays can have a good OEE and a low TEEP, which usually means there's capacity available in the hours it doesn't run."
    - q: "When should you use TEEP?"
      a: "When someone proposes a new line or another big capital investment. A low TEEP alongside a reasonable OEE often means the capacity already exists in unused hours. Before buying a new machine, it's worth asking whether an extra shift would do the same job."

build-vs-buy-mes:
  summary: "There are four broad ways to run shopfloor systems: code a homegrown system from scratch, build your own from building blocks, stitch best-of-breed applications together (often through a unified namespace), or configure an out-of-the-box MES/MOM platform. Coding gives complete control but takes longest and leaves everything to you, including security and upgrades. Building from blocks fits exactly and starts cheaply, but you still own it for its whole life. Stitching gives depth in each area, but every boundary is an interface to maintain. A platform costs more up front, but the data is connected and in context from the start, with no integrations between shopfloor functions and the vendor maintaining it. Most factories end up with a mix, so the real choice is which one is the backbone."
  faq:
    - q: "Should we build our own MES?"
      a: "It can work for a narrow scope and a strong internal team, and it fits exactly. The trade-off is that you own it for its whole life: upgrades, security, documentation and every new capability. Knowledge also tends to sit with a few people. For a full MES/MOM across production, quality, inventory and maintenance, most manufacturers get more value over time from configuring a platform and building only at the edges."
    - q: "Is stitching best-of-breed tools together through a UNS a good approach?"
      a: "It can be. Each department gets a tool that's very good at its job, and a well-governed unified namespace cuts point-to-point integrations. The cost is that every boundary is an interface to own and retest, some context is lost between systems, and someone has to design and govern the architecture."
    - q: "What does a homegrown MES really cost?"
      a: "More than it appears. There's no licence fee, but the developers' time is real money, and it grows with every new feature, upgrade and departure. Add the cost of keeping it secure and compatible, and the risk when the person who built it leaves. Compare costs over ten years, not just the first project."
    - q: "Is low-code an alternative to MES?"
      a: "Low-code platforms are one way of building your own shopfloor applications, and they're usually much faster than coding from scratch. Many MES/MOM platforms include low-code tools too. Plenty of manufacturers combine the two, with MES/MOM running the core operation and low-code filling gaps at the edges."

preventive-vs-predictive-maintenance:
  label: The short version
  summary: "Reactive maintenance fixes things when they break, preventive works to a schedule, condition-based acts on measured wear, and predictive forecasts failures from data. The right answer is a mix chosen asset by asset. Run cheap, non-critical assets to failure, and save predictive for bottleneck assets with measurable warning signs and enough failure history."
  faq:
    - q: "What is the difference between preventive and predictive maintenance?"
      a: "Preventive maintenance happens on a schedule, by calendar time or by usage such as running hours or cycles. Predictive maintenance uses condition data and failure history to forecast when a failure is likely, so work is done at the last sensible moment. Preventive is simpler to run; predictive needs sensors, data and history, and pays back most on critical assets."
    - q: "Where should a factory start with predictive maintenance?"
      a: "With accurate downtime data. Most factories still record stops at the end of the shift from memory, and miss short stops altogether. Capture stops automatically from the equipment with reasons added while they're fresh, then add condition sensors to bottleneck assets. Models need failure history and maintenance actions too, so the data foundation comes first."

historian-vs-mes:
  summary: "A historian stores high-frequency machine signals, often every second, for engineers to trend and troubleshoot. MES/MOM records operational events with context, such as orders, lots, stops and reasons, and manages the work itself. They link by time and equipment. A historian alone can't run orders or trace material, so most manufacturers need both."
  faq:
    - q: "Is a historian the same as an MES?"
      a: "No. A historian is a time-series database that records process values at high frequency, which engineers use to see what a process was doing. MES/MOM records events with context, such as which order ran, which lot was consumed and why a machine stopped, and it manages the work. A historian watches the process; MES/MOM runs the operation."
    - q: "Do I need a historian if I have MES?"
      a: "Often yes, especially in process industries. MES/MOM doesn't need to keep every high-frequency reading, and a historian stores them efficiently for years. The two work best linked: MES/MOM tells you which machine and which hours were involved in a problem, and the historian shows exactly what the process was doing then."

lot-vs-serial-traceability:
  summary: "Lot traceability tracks quantities that share an identifier, serial traceability tracks every individual item, and time-based traceability traces continuous processes by time window. Lot and batch are often used interchangeably. The right level depends on the material and product, what customers and regulators require, and what a recall would cost."
  faq:
    - q: "What is the difference between lot and serial traceability?"
      a: "Lot traceability gives a quantity of material one identifier, so you know which lots went into which lots. Serial traceability gives every individual item its own identifier, so you know exactly which components went into exactly which unit. Serial is more precise in a recall but needs every item marked and scanned."
    - q: "What is the difference between a lot and a batch?"
      a: "Often nothing: many companies use the words interchangeably. Where there's a difference, a batch is usually the quantity made in one production run, and a lot is a quantity tracked under one identifier. In US pharmaceutical regulations, a lot can be a whole batch or a defined portion of one."
    - q: "Do I need serial traceability?"
      a: "It depends on the product. Regulated devices, aerospace parts and products serviced in the field often need serial-level records. Many other manufacturers use lot-level traceability with tight lot sizes, recorded as material is actually consumed rather than backflushed afterwards."

isa-88-and-isa-95:
  summary: "ISA-88 (S88, IEC 61512) is the batch control standard, first published in 1995. It defines physical, process, procedural and recipe models, and separates recipes from equipment. ISA-95 (IEC 62264), with Part 1 published in 2000, standardises how manufacturing operations connect to the business, defining the four areas of operations and the data ERP and MES/MOM exchange. ISA-88 lives mainly at the control level, ISA-95 mainly at level 3 and the boundary with ERP, and batch process plants usually need both."
  faq:
    - q: "What is the difference between ISA-88 and ISA-95?"
      a: "ISA-88 standardises batch control: how recipes and equipment are modelled inside the control system. ISA-95 standardises how manufacturing operations are organised and integrated with business systems such as ERP. One looks down into the process, the other looks up to the business."
    - q: "Do discrete manufacturers need ISA-88?"
      a: "Rarely in detail. ISA-95 matters most for discrete manufacturers, especially when integrating ERP and MES/MOM. ISA-88's idea of separating product definitions from equipment is still worth knowing."
    - q: "How do ISA-88 and ISA-95 fit together?"
      a: "They were designed to be compatible. ISA-88's process cells and units sit under ISA-95's areas and work centres, giving one equipment hierarchy from ERP to the control module. MES/MOM handles the batch order and materials, the batch manager runs the phases, ISA-95 describes the exchange between them and ISA-88 describes what happens inside."

erp-vs-mrp-vs-mes:
  summary: "ERP runs the business on one set of data, from finance to purchasing. MRP is the planning process inside ERP that works out what to make and buy, and when, from demand, bills of materials and stock. MES/MOM runs that work on the shopfloor and records what actually happened. Most manufacturers use all three, with MES/MOM feeding actuals back so the next MRP run starts from reality."
  faq:
    - q: "What is the difference between ERP, MRP and MES?"
      a: "ERP manages the whole business: finance, sales, purchasing, inventory and planning. MRP is the part of ERP that calculates the production and purchase orders needed to meet demand. MES/MOM executes those orders on the shopfloor and records quantities, scrap, downtime and the materials consumed."
    - q: "Is MRP part of ERP?"
      a: "Usually, yes. MRP started as a standalone planning method in the 1960s and grew into MRP II, which added capacity and other resources. ERP then extended that across the whole business. Today MRP is normally a module or process inside ERP, though some smaller manufacturers use a standalone MRP system."
    - q: "Can ERP or MRP run the shopfloor?"
      a: "For a small, simple operation, ERP shopfloor reporting may be enough. Real-time machine data, lot-level genealogy with quality results, in-process checks and guided work instructions are MES/MOM functions. ERP and MRP plan in days and weeks, while MES/MOM works in minutes."

qms-vs-lims-vs-mes:
  summary: "A QMS runs the quality management system across the business, including CAPA, deviations, audits and controlled documents. A LIMS runs the lab, from samples to results and certificates of analysis. MES/MOM runs quality at the point of production, and a good MOM platform covers the QMS scope too. Whether you need a LIMS depends on your industry and regulations."
  faq:
    - q: "What is the difference between a QMS and a LIMS?"
      a: "A QMS manages the quality system: CAPAs, deviations, complaints, audits and controlled documents, over weeks and months. A LIMS manages the lab: samples, tests and results, over hours and days. One proves the system works and improves it; the other produces a trustworthy result for every sample."
    - q: "What does MES/MOM do for quality?"
      a: "Strictly, MES covers production and MOM adds quality, inventory and maintenance. MOM quality functions run checks on the line, triggered by what's running: in-process inspections, SPC, sampling plans and holds. Every result is tied to the order, the lot and the operator, which feeds genealogy and the batch record."
    - q: "How do QMS, LIMS and MES/MOM work together?"
      a: "MES/MOM triggers samples and records line checks. The LIMS tests samples and returns results. Out-of-spec results and serious non-conformances move into the QMS for investigation and CAPA. Batch release draws on the batch record from MES/MOM and LIMS results, and can be blocked by an open deviation in the QMS."

cmms-vs-eam-vs-mes:
  summary: "A CMMS helps a maintenance team plan and record work, such as work orders, preventive schedules and spare parts, usually at one site. An EAM does that and manages assets across their whole life and across sites, including cost and capital planning. MES/MOM knows what the equipment is doing right now, so it supplies the run hours, counts and downtime reasons that maintenance planning depends on."
  faq:
    - q: "What is the difference between a CMMS and an EAM?"
      a: "A CMMS focuses on maintenance work: requests, work orders, preventive schedules, labour and parts. An EAM covers the whole asset lifecycle, from acquisition to disposal, including asset value and capital planning, usually across many sites. An EAM includes CMMS capability, but not the other way round."
    - q: "Where does MES/MOM fit with CMMS and EAM?"
      a: "Strictly, MES covers production and MOM adds maintenance. A good MOM platform handles day-to-day maintenance itself, from operator requests to work orders and preventive maintenance on actual run hours, which replaces the need for a CMMS. Where an EAM is needed, MOM feeds it run hours, counts and downtime for asset management."
    - q: "Do I need a CMMS or an EAM?"
      a: "If you run a MOM platform with maintenance capability, you don't need a CMMS. Without one, a CMMS is often enough for getting preventive maintenance done. An EAM suits businesses with many sites and expensive assets, where leadership needs lifecycle cost and replacement planning. If you already run an ERP suite, its EAM module may cover what you need."

unified-namespace-uns:
  summary: "A unified namespace (UNS) is an architecture for sharing live data: systems publish what they know to a central broker, organised by the plant hierarchy, and others subscribe. MES/MOM is an application that runs the operation, dispatching orders, enforcing checks and keeping history with its context. A UNS shows the current state rather than running the operation, and many architectures use both."
  faq:
    - q: "What is a unified namespace?"
      a: "A unified namespace is an architectural pattern rather than a product. Every system publishes its data to one central, structured place, usually an MQTT broker, organised by enterprise, site, area, line and machine. Any system that needs the data subscribes, which cuts point-to-point integrations."
    - q: "Can a unified namespace replace an MES?"
      a: "For simple visibility, such as live machine status and counts, a UNS with some light applications can cover a lot. On its own it doesn't run orders, enforce quality checks or keep genealogy, because it shows the current state rather than keeping history or running business logic."
    - q: "How do UNS and MES/MOM work together?"
      a: "Machines publish to the namespace. MES/MOM subscribes to the machine data it needs, adds the context of the order, material lot and operator, and publishes that contextualised data back. Other systems, such as data platforms and AI applications, can then subscribe to operational events rather than raw signals."

plc-vs-scada-vs-dcs-vs-mes:
  summary: "A PLC controls a machine in milliseconds. SCADA supervises equipment, showing operators what it's doing and raising alarms. A DCS controls whole process plants as one integrated system. MES/MOM sits above them all at ISA-95 level 3, managing orders, materials, quality and genealogy. Most plants have PLCs, and use SCADA or a DCS depending on the process, with MES/MOM above the control layer."
  faq:
    - q: "What is the difference between PLC, SCADA and DCS?"
      a: "A PLC is a rugged controller for a machine or a section of a line. SCADA sits above PLCs to monitor and supervise equipment, often across a plant or a wide area. A DCS combines control and supervision in one integrated system designed for large continuous and batch process plants."
    - q: "Where does MES fit with PLC, SCADA and DCS?"
      a: "MES/MOM sits above the control layer at ISA-95 level 3. It reads data from PLCs, SCADA or the DCS, adds the context of the order and the lot, and manages the operation: dispatching orders, guiding operators and recording quality and genealogy. It passes results up to ERP."
    - q: "Does a DCS replace an MES?"
      a: "No. A DCS controls the process. It typically doesn't manage material status and genealogy across the plant, handle orders from ERP or produce a complete electronic batch record. In batch plants, the DCS batch manager runs the recipe's control steps while MES/MOM handles the order, the materials and the batch record."

takt-time-vs-cycle-time-vs-lead-time:
  summary: "Takt time is the pace you need to produce at to meet demand: available time divided by customer demand. Cycle time is how long it actually takes to complete a unit or a step. Lead time is how long the customer waits, from order to delivery, including all the waiting in between. Comparing them shows whether you can meet demand, and how much of lead time is waiting."
  faq:
    - q: "What is the difference between takt time and cycle time?"
      a: "Takt time is set by customer demand: how often you need to finish a unit to keep up. Cycle time is set by the process: how long a unit or step actually takes. If cycle time is longer than takt time at the bottleneck, you can't meet demand without more time or capacity."
    - q: "How do you calculate takt time?"
      a: "Divide available production time by customer demand for the same period. A line that runs for 450 minutes a shift, with demand of 900 units a shift, has a takt time of 30 seconds."
    - q: "What is the difference between lead time and cycle time?"
      a: "Cycle time measures the work on a unit. Lead time measures the whole wait, from order to delivery, including queues, material waits, inspection and shipping. In most factories, processing is a small fraction of lead time."

mtbf-vs-mttr-vs-mttf:
  summary: "MTBF (mean time between failures) is how long a repairable asset runs, on average, before it fails. MTTR (mean time to repair) is how long it takes to get it running again. MTTF (mean time to failure) is how long a non-repairable item lasts before it's replaced. MTBF and MTTR combine into availability, and all of them depend on accurate downtime data."
  faq:
    - q: "What is the difference between MTBF and MTTF?"
      a: "MTBF applies to repairable assets, such as machines and lines, and measures the average running time between failures. MTTF applies to items you replace rather than repair, such as bearings or sensors, and measures how long they last on average."
    - q: "How do you calculate MTBF and MTTR?"
      a: "MTBF is total operating time divided by the number of failures. MTTR is total repair time divided by the number of repairs. A filler that runs 1,000 hours with five failures has an MTBF of 200 hours; if those repairs took 15 hours in total, MTTR is three hours."
    - q: "How do MTBF and MTTR relate to availability?"
      a: "Availability equals MTBF divided by the sum of MTBF and MTTR. With an MTBF of 200 hours and an MTTR of three hours, availability is about 98.5%. Improving either figure raises availability, which also feeds OEE."

first-pass-yield-vs-rolled-throughput-yield:
  summary: "First pass yield (FPY) is the share of units that pass a step right first time, with no rework or scrap. Rolled throughput yield (RTY) multiplies the FPY of every step to give the probability a unit gets through the whole process right first time. Final yield counts reworked units as good, so it can look far better than RTY."
  faq:
    - q: "What is the difference between first pass yield and rolled throughput yield?"
      a: "First pass yield measures right-first-time performance at one step, or for the line as a whole. Rolled throughput yield multiplies the first pass yield of each step, showing how many units get through every step without being touched again."
    - q: "How do you calculate rolled throughput yield?"
      a: "Multiply the first pass yield of each step together. Four steps at 95% each give an RTY of 0.95 × 0.95 × 0.95 × 0.95, which is about 81%."
    - q: "Why is final yield misleading?"
      a: "Final yield counts reworked units as good, so a part fixed twice looks the same as one that was right first time. The rework still costs time and capacity. FPY and RTY expose it, which is why they're widely used in Six Sigma."

industry-4-0-vs-industry-5-0:
  summary: "Industry 4.0 describes connected, data-driven manufacturing, with machines and systems integrated and analytics used to optimise operations. Industry 5.0, a European Commission concept from 2021, builds on it and adds human-centric, resilient and sustainable goals. Both depend on accurate, contextualised shopfloor data. In my view the outcomes matter more than the version numbers."
  faq:
    - q: "What is the difference between Industry 4.0 and Industry 5.0?"
      a: "Industry 4.0 focuses on connectivity, data and automation to improve efficiency and productivity. Industry 5.0 builds on it, and asks technology to serve wider goals: supporting people on the shopfloor, making operations resilient to disruption and reducing environmental impact."
    - q: "Does Industry 5.0 replace Industry 4.0?"
      a: "No. The European Commission presents Industry 5.0 as a complement to Industry 4.0, not a replacement. It uses much the same technology, with more emphasis on people, resilience and sustainability."
    - q: "Is Industry 5.0 about cobots?"
      a: "Collaboration between people and robots is part of it, and some people use Industry 5.0 to mean exactly that. The European Commission's framing is broader, covering human-centric technology, resilience and sustainability across manufacturing."

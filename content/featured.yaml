    blurb: A live panel on how manufacturers can connect ERP, shopfloor execution and AI into one operating model.
    links:
      - {kind: apple, url: "https://podcasts.apple.com/gb/podcast/wbsp910-scale-growth-by-understanding-infor-mes-strategy/id1544644166?i=1000791552457", show: false}

    label: Podcast
    outlet: Unplugged IIoT
    card_outlet: "Unplugged: An IIoT Podcast"
    show: "Unplugged: An IIoT Podcast · Episode 38"
    type: podcast
    role: Guest
    date: 2025-12-02
    with: Hosts Phil Seboa and Ed Fuentes (Industry Sage Media)
    blurb: A conversation on what MES really does on the shopfloor, where the savings come from, and how manufacturers can get started without over-complicating it.
    links:
      - {kind: episode, url: "https://www.industrysagemedia.com/matt-barber"}
